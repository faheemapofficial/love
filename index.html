<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little World for You</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Caveat:wght@600&family=Nunito:wght@400;700&display=swap">
<style>
:root{--mid:#0f1330;--plum:#3a1748;--gold:#e6c988;--ivory:#fbf3e8;--rose:#d9a0a5;--cherry:#b3193f;--lav:#cdbfe8;--ink:#3b2233;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--mid);font-family:'Nunito',system-ui,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
.serif,h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
.hand{font-family:'Caveat','Segoe Script',cursive}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#fx{position:fixed;inset:0;z-index:30;pointer-events:none}
/* gift */
#gift{position:fixed;inset:0;z-index:5;background:radial-gradient(ellipse at 50% 55%,#4b1f57 0,#1a1440 48%,var(--mid) 100%);display:grid;place-items:center;transition:opacity 1.2s ease-in;overflow:hidden}
#gift.zoom{opacity:0}
.gp{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:0;animation:float 11s linear infinite}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-105vh) translateX(20px);opacity:0}}
#giftBtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;min-width:min(90vw,340px);min-height:65vh;position:relative;color:var(--gold)}
#giftBtn svg{width:min(70vw,300px);overflow:visible;transition:transform 1.3s ease-in}
#giftBtn:active svg{transform:scale(.97)}
.zoom #giftBtn svg{transform:scale(5)}
.tap{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.5rem;letter-spacing:.14em;animation:pulse 2.6s ease-in-out infinite;transition:opacity .5s}
.go .tap{opacity:0;animation:none}
@keyframes pulse{50%{opacity:.55}}
#lid{transform-box:fill-box;transform-origin:50% 100%;animation:wob 3.4s ease-in-out infinite;transition:transform .9s,opacity 1s}
@keyframes wob{0%,72%,100%{transform:none}82%{transform:translateY(-5px) rotate(-1.5deg)}90%{transform:translateY(-2px)}}
.go #lid{animation:none}
.lift #lid{transform:translateY(-18px) rotate(-3deg)}
.open #lid{transform:translate(-46px,-80px) rotate(-26deg);opacity:0}
#bow{transform-box:fill-box;transform-origin:center;transition:transform .9s,opacity .9s}
.untie #bow{transform:scale(.2);opacity:0}
#seal{transition:opacity .9s}
.go #seal{filter:drop-shadow(0 0 8px #ffd9a0)}
.untie #seal{opacity:0}
#glow{opacity:.35;transition:opacity 1s}.lift #glow{opacity:.8}.open #glow{opacity:1}
#fh{position:absolute;left:50%;top:42%;width:36px;margin-left:-18px;opacity:0;pointer-events:none;filter:drop-shadow(0 0 12px #ffcf9a)}
.rise #fh{animation:rise 1.2s ease-out forwards}
.dive #fh{animation:dive .8s ease-in forwards}
@keyframes rise{from{opacity:0;transform:translateY(0)}to{opacity:1;transform:translateY(-130px)}}
@keyframes dive{from{opacity:1;transform:translateY(-130px)}to{opacity:0;transform:translateY(10px) scale(.2)}}
/* world */
#world{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;visibility:hidden;opacity:0;transition:opacity 1.4s;background:linear-gradient(#8b6fae 0,#d9a0a5 900px,#f3d9cf 1500px,var(--ivory) 2000px);background-attachment:local}
#world.on{visibility:visible;opacity:1}
.hero{position:relative;min-height:100svh;display:grid;place-content:center;text-align:center;padding:2rem 1.4rem 6rem;color:var(--ivory);background:radial-gradient(2px 2px at 18% 22%,#fff,transparent),radial-gradient(2px 2px at 78% 14%,#fff,transparent),radial-gradient(1.5px 1.5px at 62% 36%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 46%,#fff,transparent),linear-gradient(#1e1a4a,#4a2f78 60%,#8b6fae)}
.hero:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:90px;background:#8b6fae;clip-path:polygon(0 60%,15% 38%,35% 66%,55% 34%,80% 62%,100% 30%,100% 100%,0 100%)}
.hero h1{font-size:clamp(3.4rem,17vw,6rem);color:var(--gold);line-height:1}
.hero .big{font-size:clamp(1.9rem,8vw,2.8rem);margin-top:.5rem}
.hero .sub{max-width:24rem;margin:1.6rem auto 0;line-height:1.7;font-size:1.05rem}
.rv{opacity:0;transform:translateY(14px);transition:opacity 1.1s,transform 1.1s}.rv.show{opacity:1;transform:none}
.cue{position:absolute;bottom:105px;left:50%;margin-left:-10px;z-index:1;animation:bob 2s ease-in-out infinite}
.items{display:flex;flex-direction:column;gap:2.4rem;padding:2rem 1.2rem 1rem;max-width:34rem;margin:0 auto}
.obj{position:relative;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:.5rem;min-width:48px;min-height:48px;animation:bob 5s ease-in-out infinite;animation-delay:var(--d)}
.obj:nth-child(odd){align-self:flex-start;margin-left:5vw}
.obj:nth-child(even){align-self:flex-end;margin-right:5vw}
.obj.key{align-self:center;margin:0}
@keyframes bob{50%{transform:translateY(-8px)}}
.art svg{width:112px;height:112px;overflow:visible;filter:drop-shadow(0 6px 8px rgba(60,20,60,.3));transition:transform .2s}
.obj:active .art svg{transform:scale(.94)}
.lab{background:rgba(251,243,232,.94);padding:.35rem .95rem;border-radius:999px;font-weight:700;font-size:.95rem;color:var(--plum)}
.obj:before,.obj:after{content:'✦'/'';position:absolute;color:var(--gold);font-size:1rem;animation:tw 3s ease-in-out infinite}
.obj:before{top:6px;left:12px}.obj:after{top:40px;right:6px;animation-delay:1.4s;font-size:.75rem}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.chk{position:absolute;top:2px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--cherry);color:#fff;display:grid;place-items:center;font-size:.85rem;opacity:0;transform:scale(.4);transition:.4s}
.done .chk{opacity:1;transform:none}
.key .art svg{filter:drop-shadow(0 0 14px #ffd98a)}
.appear{animation:appear 1.6s ease-out,bob 5s 1.6s ease-in-out infinite}
@keyframes appear{from{opacity:0;transform:scale(.5) rotate(-20deg)}}
.foot{text-align:center;padding:1rem 1rem 3rem}
.quiet{text-decoration:underline;min-height:48px;padding:.8rem 1rem;color:var(--plum)}
#replay{position:fixed;top:calc(.6rem + env(safe-area-inset-top,0px));left:.6rem;z-index:8;width:48px;height:48px;border-radius:50%;background:rgba(251,243,232,.88);color:var(--plum);display:grid;place-items:center}
/* panel */
#panel,#fin{position:fixed;inset:0}
#panel{z-index:20;display:grid;place-items:center;padding:.75rem;background:rgba(40,15,50,.62)}
.sheet{position:relative;width:min(100%,34rem);max-height:calc(100dvh - 1.5rem);overflow:auto;background:var(--ivory);border-radius:18px;padding:3.6rem 1.3rem 2rem;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:sheet .5s ease-out}
@keyframes sheet{from{opacity:0;transform:translateY(20px) scale(.97)}}
.sheet.night{background:linear-gradient(#0f1330,#2a1747);color:#f3ecff}
.x{position:absolute;top:.6rem;right:.6rem;min-width:48px;min-height:48px;padding:0 1rem;border-radius:24px;background:rgba(0,0,0,.08);font-weight:700}
.night .x{background:rgba(255,255,255,.14)}
.sheet h2{font-size:2rem;text-align:center;margin-bottom:1rem}
.paper{background:#fffaf1;border:1px solid #ead9bd;border-radius:6px;padding:1.4rem 1.2rem;box-shadow:0 6px 18px rgba(80,40,40,.15);color:var(--ink)}
.letter{transform-origin:top;animation:unfold .9s ease-out}
@keyframes unfold{from{opacity:0;transform:perspective(700px) rotateX(-75deg)}}
.letter p{line-height:1.75;font-size:1.05rem;margin-bottom:1em}.letter p:last-child{margin:0;font-weight:700}
.btn{min-height:48px;padding:.7rem 1.4rem;border-radius:999px;background:var(--cherry);color:#fff;font-weight:700;box-shadow:0 3px 0 #7d0f2b;transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.alt{background:var(--lav);color:var(--plum);box-shadow:0 3px 0 #9d8bc4}
.row{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:1.2rem}
.msg{text-align:center;font-size:1.25rem;line-height:1.6;margin:1.2rem 0;animation:fade 1s}
@keyframes fade{from{opacity:0}}
.center{display:flex;flex-direction:column;align-items:center}
.prog{text-align:center;font-weight:700;color:var(--cherry);margin-bottom:.4rem}
.jar{position:relative;width:240px;height:250px;margin:0 auto}
.jar>svg{position:absolute;inset:0;width:100%;height:100%}
.jh{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;display:grid;place-items:center;animation:glow 2.6s ease-in-out infinite}
.jh svg{width:34px;filter:drop-shadow(0 0 6px #ff9db5)}
@keyframes glow{50%{transform:scale(1.1)}}
.jh.out{animation:out 1s ease-in forwards;pointer-events:none}
@keyframes out{to{transform:translateY(-150px) scale(1.6);opacity:0}}
.card{background:#fff;border-radius:12px;padding:1rem;margin-top:.8rem;text-align:center;line-height:1.55;font-size:1.05rem;box-shadow:0 3px 10px rgba(120,40,70,.15);border-left:5px solid var(--rose)}
.m0{animation:m0 .9s}.m1{animation:m1 .9s}.m2{animation:m2 .9s}.m3{animation:m3 1s}.m4{animation:m4 .9s}.m5{animation:m5 1s}
@keyframes m0{from{opacity:0;transform:translateY(30px)}}@keyframes m1{from{opacity:0;transform:scale(.6)}}@keyframes m2{from{opacity:0;transform:translateX(-40px)}}@keyframes m3{from{opacity:0;transform:rotate(-6deg) translateY(20px)}}@keyframes m4{from{opacity:0;transform:translateX(40px)}}@keyframes m5{from{opacity:0;filter:blur(8px)}}
.sky{position:relative;width:100%;max-width:340px;aspect-ratio:300/260;margin:0 auto}
.sky>svg{position:absolute;inset:0;width:100%;height:100%}
.hp{fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;opacity:.8}
.done .hp{transition:stroke-dashoffset 1.6s ease;stroke-dashoffset:0}
.star{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;display:grid;place-items:center;color:#8a7fb0}
.star svg{width:34px;fill:currentColor;transition:.6s}
.star.lit{color:#ffe08a}.star.lit svg{filter:drop-shadow(0 0 10px #ffd66b);transform:scale(1.35) rotate(20deg)}
.lines p{text-align:center;font-size:1.15rem;line-height:1.6;margin-top:.7rem;animation:fade 1.2s}
.pres{display:block;margin:1rem auto;padding:1rem}.pres svg{width:150px;height:150px;overflow:visible;animation:bob 3s ease-in-out infinite}
.pres.un svg{animation:unwrap .8s ease-in forwards}
@keyframes unwrap{to{transform:scale(1.3);opacity:0}}
.hugsvg{width:min(100%,260px);display:block;margin:0 auto;overflow:visible}
.rb{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600}
.r1{stroke:var(--cherry)}.r2{stroke:var(--gold)}
.play .rb{animation:draw 1.8s ease-out forwards}.play .r2{animation-delay:.3s}
.play .hh{animation:beat 1.2s 1.2s ease-in-out 2}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes beat{50%{transform:scale(1.15)}}
.hh{transform-box:fill-box;transform-origin:center;fill:var(--cherry)}
.note{text-align:center;animation:unfold .8s ease-out}.q{font-size:2rem;line-height:1.2}
.proc{position:relative;height:190px;display:flex;justify-content:center;align-items:flex-end;gap:6px}
.proc .th{width:22px;animation:march 1.6s ease-out backwards}
@keyframes march{from{transform:translateX(-45vw)}}
.flower{position:absolute;bottom:20px;width:170px;animation:bloom 1.4s 1.5s ease-out backwards}
@keyframes bloom{from{transform:scale(0) rotate(-40deg);opacity:0}}
.pulse{animation:fade 1s}
/* final */
#fin{z-index:25;overflow-y:auto;background:linear-gradient(#1a1440,#4a2f78 30%,#d9a0a5 65%,#fbe7c8);transition:background 2s}
.fstage{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 3rem}
.door{width:150px;flex:none;overflow:visible}
#dr{transform-box:fill-box;transform-origin:left center;transition:transform 1.4s ease-in-out}
.open #dr{transform:perspective(500px) rotateY(-75deg)}
#dk{transform-box:fill-box;transform-origin:center;transition:transform 1.1s}.turn #dk{transform:rotate(90deg)}
#lit{opacity:0;transition:opacity 1.6s}.open #lit{opacity:1}
.hf{position:relative;width:min(84vw,320px);aspect-ratio:1;margin:1rem 0}
.hf span{position:absolute;font-size:clamp(14px,4.4vw,22px);line-height:1;opacity:0;transform:translate(-50%,-50%);transition:left 2.4s ease-out,top 2.4s ease-out,opacity .6s}
.fedge svg{position:absolute;width:64px;height:64px;opacity:0;transition:opacity 1.4s}
.edges .fedge svg{opacity:.75}.edges2 .fedge svg{opacity:.3}
.fmsg{text-align:center;color:var(--plum);visibility:hidden;opacity:0;transition:opacity 1.6s;max-width:26rem;padding:1.2rem;background:rgba(251,243,232,.9);border-radius:16px}
.fmsg.show{visibility:visible;opacity:1}
.fmsg .serif{font-size:clamp(1.6rem,6.5vw,2.2rem);line-height:1.35}
.fmsg .s{margin:1rem 0 1.2rem;line-height:1.6}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:opacity .3s!important;scroll-behavior:auto!important}.hp,.rb{stroke-dasharray:none!important;stroke-dashoffset:0!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="live" class="sr" aria-live="polite"></div>

<div id="gift">
  <button id="giftBtn" type="button"></button>
  <svg id="fh" viewBox="0 0 32 29" aria-hidden="true"><path fill="#ffb3c4" d="M16 28C2 18 0 9 5 4c5-5 10-1 11 3 1-4 6-8 11-3 5 5 3 14-11 24z"/></svg>
</div>

<main id="world" aria-label="A little world for Safa" tabindex="-1">
  <section class="hero">
    <h1 class="rv" id="hName"></h1><p class="rv serif big"></p><p class="rv serif big"></p><p class="rv sub"></p>
    <svg class="cue rv" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6l7 7 7-7" fill="none" stroke="#ffe7b0" stroke-width="2.5" stroke-linecap="round"/></svg>
  </section>
  <section class="items" id="items"></section>
  <div class="foot"><button class="quiet" id="finBtn" type="button"></button></div>
</main>

<button id="replay" type="button" aria-label="Replay the opening" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>

<div id="panel" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="ptitle">
    <button class="x" id="closeBtn" type="button" aria-label="Close">Close ✕</button>
    <div id="pbody"></div>
  </div>
</div>

<div id="fin" hidden role="dialog" aria-modal="true" aria-label="One last surprise" tabindex="-1"></div>

<script>
const C={
 colors:{mid:'#0f1330',plum:'#3a1748',gold:'#e6c988',ivory:'#fbf3e8',rose:'#d9a0a5',cherry:'#b3193f',lav:'#cdbfe8',ink:'#3b2233'},
 t:{go:200,lift:1000,rise:1300,dive:2600,open:3400,zoom:4400,world:4600,h0:5400,h1:6200,h2:7000,sub:7800,end:8200},
 tap:'Tap here',
 hero:['Safa','I love you','I miss you'],
 sub:'I made you a little world, filled with the things I wish I could tell you in person.',
 obj:{env:'A letter for you',jar:'Little reasons',moon:'When I miss you',gift:'A little warmth',note:'One little question'},
 key:'One last surprise',reveal:'Reveal final surprise',keyLive:'A golden key has appeared in the world.',
 letter:['Safa,','I don’t always know how to explain how much you mean to me. Sometimes it’s in the little things—wanting to tell you about my day, wondering how yours went, or smiling when I see your name on my screen.','I love you, and I miss you. I wish I could turn those words into something you could hold, so I made this little world for you instead.','Every small surprise here is another way of saying that you matter to me. I hope it makes you smile, because making you happy means so much to me.','With love,<br>Faheem'],
 jar:['You make ordinary moments feel special.','I smile when I see your name on my screen.','I love the person you are.','Even a small conversation with you can brighten my day.','You are someone I always look forward to talking to.','There are so many little things about you that I love.'],
 stars:['I miss your voice.','I miss your smile.','I miss talking to you.','I wish you were here.','Until then, this little sky is yours.'],
 starEnd:'Even when we’re apart, you’re still part of my day.',
 hug:'If I could step through this screen, I’d give you a hug.',again:'Another hug',
 q:'Can I make you smile?',yes:'You already did',more:'Try a little more',
 yesRes:'Then this little surprise was worth it.',moreRes:'This one’s for my favourite smile.',
 final:['Safa,','I love you.','I miss you.','And I’m so glad you’re in my life.'],
 finalSub:'This little world ends here, but the love behind it goes with you.',explore:'Explore again'
};
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
Object.entries(C.colors).forEach(([k,v])=>document.documentElement.style.setProperty('--'+k,v));
const HP='M16 28C2 18 0 9 5 4c5-5 10-1 11 3 1-4 6-8 11-3 5 5 3 14-11 24z';
const hs=(c,cl='')=>`<svg viewBox="0 0 32 29" class="${cl}" aria-hidden="true"><path fill="${c}" d="${HP}"/></svg>`;
const hp=(x,y,s,c)=>`<path transform="translate(${x} ${y}) scale(${s})" fill="${c}" d="${HP}"/>`;
const timers=()=>{let a=[];return{add(f,ms){a.push(setTimeout(f,RM?Math.min(ms,250):ms))},clear(){a.forEach(clearTimeout);a=[]}}};
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const sv=(b)=>`<svg viewBox="0 0 120 120" aria-hidden="true">${b}</svg>`;
const ICON={
 env:sv(`<rect x="12" y="32" width="96" height="64" rx="6" fill="#f6e7d4" stroke="#c9a36a" stroke-width="2"/><path d="M12 36L60 72l48-36" fill="none" stroke="#c9a36a" stroke-width="2"/><circle cx="60" cy="72" r="11" fill="#b3193f"/>${hp(53,66,.4,'#fff')}`),
 jar:sv(`<rect x="34" y="10" width="52" height="14" rx="4" fill="#c9a36a"/><path d="M38 26h44q14 8 14 26v44q0 14-14 14H38q-14 0-14-14V52q0-18 14-26z" fill="#fff" fill-opacity=".3" stroke="#e6c988" stroke-width="2.5"/>${hp(34,62,.9,'#b3193f')}${hp(58,78,.8,'#d9587a')}${hp(48,44,.8,'#ff8fa8')}`),
 moon:sv(`<circle cx="60" cy="60" r="52" fill="#fff3c4" opacity=".25"/><circle cx="60" cy="60" r="38" fill="#fbeec5"/><circle cx="48" cy="50" r="7" fill="#efdca0"/><circle cx="72" cy="72" r="9" fill="#efdca0"/><circle cx="70" cy="44" r="4" fill="#efdca0"/>`),
 gift:sv(`<rect x="20" y="52" width="80" height="58" rx="4" fill="#d9a0a5"/><rect x="14" y="40" width="92" height="18" rx="4" fill="#c98890"/><rect x="54" y="40" width="12" height="70" fill="#b3193f"/><path d="M60 40C40 12 26 32 60 40 94 32 80 12 60 40" fill="none" stroke="#b3193f" stroke-width="5"/>`),
 note:sv(`<path d="M22 22h76v78H22z" fill="#fffaf0" stroke="#cbb99a" stroke-width="2"/><path d="M22 22l38 40 38-40M22 100l38-38 38 38" fill="none" stroke="#cbb99a" stroke-width="1.6"/>${hp(52,53,.5,'#b3193f')}`),
 key:sv(`<circle cx="40" cy="40" r="20" fill="none" stroke="#e6c988" stroke-width="9"/><path d="M56 56l44 44M84 84l12-12M94 94l12-12" stroke="#e6c988" stroke-width="9" stroke-linecap="round" fill="none"/>`)
};
/* particles */
const cv=$('#fx'),g=cv.getContext('2d'),HPP=new Path2D(HP);let P=[],raf=0,W,H;
const perf=Math.min(1,(navigator.hardwareConcurrency||4)/6);
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
rs();addEventListener('resize',rs);
const COL=['#b3193f','#d9a0a5','#e6c988','#cdbfe8','#fff3d6'];
function burst(x,y,n,kinds='hsp',pow=1){
 n=RM?Math.min(n,4):Math.max(2,Math.round(n*perf));
 for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(2+Math.random()*5)*pow;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2*pow,vr:(Math.random()-.5)*.2,rot:Math.random()*6,l:0,m:70+Math.random()*60,k:kinds[i%kinds.length],c:COL[i%5],z:8+Math.random()*10})}
 if(!raf)raf=requestAnimationFrame(loop)}
function loop(){
 g.clearRect(0,0,W,H);P=P.filter(p=>p.l<p.m);
 P.forEach(p=>{p.l++;p.vx*=.985;p.vy=p.vy*.985+.08;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
  g.save();g.globalAlpha=Math.max(0,1-p.l/p.m);g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=g.strokeStyle=p.c;const s=p.z;
  if(p.k=='h'){g.scale(s/16,s/16);g.translate(-16,-14);g.fill(HPP)}
  else if(p.k=='s'){const q=s/1.3;g.beginPath();g.moveTo(0,-q);g.quadraticCurveTo(0,0,q,0);g.quadraticCurveTo(0,0,0,q);g.quadraticCurveTo(0,0,-q,0);g.quadraticCurveTo(0,0,0,-q);g.fill()}
  else if(p.k=='p'){g.beginPath();g.ellipse(0,0,s/2,s/4,0,0,6.283);g.fill()}
  else{g.lineWidth=2;g.beginPath();g.moveTo(-s,0);g.quadraticCurveTo(0,s/2,s,0);g.stroke()}
  g.restore()});
 raf=P.length?requestAnimationFrame(loop):0;if(!raf)g.clearRect(0,0,W,H)}
const centre=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
/* gift opening */
const gift=$('#gift'),gb=$('#giftBtn'),world=$('#world'),rv=[...document.querySelectorAll('.rv')],replay=$('#replay'),live=$('#live');
gb.innerHTML=`<svg viewBox="0 0 300 280" aria-hidden="true"><defs><radialGradient id="gl"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient><linearGradient id="bx" x1="0" x2="1"><stop offset="0" stop-color="#5b2a63"/><stop offset="1" stop-color="#3a1748"/></linearGradient></defs>
<ellipse cx="150" cy="262" rx="112" ry="12" fill="#000" opacity=".35"/><circle id="glow" cx="150" cy="125" r="145" fill="url(#gl)"/>
<rect x="55" y="120" width="190" height="135" rx="8" fill="url(#bx)"/><rect x="138" y="120" width="24" height="135" fill="#e6c988"/><rect x="55" y="127" width="190" height="4" fill="#ffd9a0" opacity=".7"/>
<g id="lid"><rect x="44" y="84" width="212" height="46" rx="8" fill="#4b2056"/><rect x="138" y="84" width="24" height="46" fill="#e6c988"/>
<g id="bow"><ellipse cx="122" cy="76" rx="26" ry="14" transform="rotate(-20 122 76)" fill="#e6c988"/><ellipse cx="178" cy="76" rx="26" ry="14" transform="rotate(20 178 76)" fill="#d4b06a"/><circle cx="150" cy="82" r="9" fill="#f3dda2"/></g>
<g id="seal"><circle cx="150" cy="108" r="16" fill="#b3193f" stroke="#e6c988" stroke-width="2"/>${hp(141,101,.55,'#ffd9e0')}</g></g></svg><span class="tap">${C.tap}</span>`;
for(let i=0;i<14;i++){const s=document.createElement('span');s.className='gp';s.style.cssText=`left:${Math.random()*100}%;animation-delay:${-Math.random()*11}s;animation-duration:${9+Math.random()*6}s`;gift.prepend(s)}
const tm=timers();let busy=false;
[C.hero[0]].forEach(t=>$('#hName').textContent=t);rv[1].textContent=C.hero[1];rv[2].textContent=C.hero[2];rv[3].textContent=C.sub;
function play(){
 if(busy)return;busy=true;const T=C.t,[cx,cy]=centre(gb.querySelector('svg'));
 gift.classList.add('go');burst(cx,cy-30,8,'s',.5);
 tm.add(()=>gift.classList.add('untie'),T.go);
 tm.add(()=>gift.classList.add('lift'),T.lift);
 tm.add(()=>gift.classList.add('rise'),T.rise);
 tm.add(()=>gift.classList.add('dive'),T.dive);
 tm.add(()=>{gift.classList.add('open');burst(cx,cy-40,70,'hspr',1.5);setTimeout(()=>burst(cx,cy-40,40,'spr',1),400)},T.open);
 tm.add(()=>gift.classList.add('zoom'),T.zoom);
 tm.add(()=>world.classList.add('on'),T.world);
 [T.h0,T.h1,T.h2,T.sub].forEach((t,i)=>tm.add(()=>rv[i].classList.add('show'),t));
 tm.add(()=>rv[4].classList.add('show'),T.sub+400);
 tm.add(()=>{gift.hidden=true;busy=false;replay.hidden=false;$('#hName').tabIndex=-1;$('#hName').focus({preventScroll:true})},T.end+1200);
}
gb.addEventListener('click',play);
replay.addEventListener('click',()=>{tm.clear();P=[];busy=false;gift.hidden=false;gift.className='';world.classList.remove('on');rv.forEach(e=>e.classList.remove('show'));replay.hidden=true;world.scrollTop=0;gb.focus()});
/* world */
const ids=['env','jar','moon','gift','note'],ex=new Set();
$('#items').innerHTML=ids.map((id,i)=>`<button class="obj" type="button" data-id="${id}" style="--d:${-i*1.1}s"><span class="art">${ICON[id]}</span><span class="lab">${C.obj[id]}</span><span class="chk" aria-hidden="true">♥</span></button>`).join('')+`<button class="obj key" id="keyBtn" type="button" hidden><span class="art">${ICON.key}</span><span class="lab">${C.key}</span></button>`;
$('#finBtn').textContent=C.reveal;
world.addEventListener('click',e=>{if(!e.target.closest('button')&&!e.target.closest('h1,p'))burst(e.clientX,e.clientY,8,'h',.6)});
function mark(id){
 ex.add(id);const b=$(`.obj[data-id="${id}"]`);b.classList.add('done');b.setAttribute('aria-label',C.obj[id]+', explored');
 if(ex.size==ids.length&&$('#keyBtn').hidden){$('#keyBtn').hidden=false;$('#keyBtn').classList.add('appear');live.textContent=C.keyLive}}
/* panels */
const panel=$('#panel'),sheet=$('#sheet'),pbody=$('#pbody'),closeBtn=$('#closeBtn'),pt=timers(),fin=$('#fin');
let last=null,clean=null,isOpen=false,finOpen=false;
const setInert=on=>{world.inert=on;replay.inert=on};
const isFocus=()=>{};
function openPanel(id,btn){
 if(isOpen||finOpen)return;isOpen=true;last=btn;pbody.innerHTML='';sheet.className='sheet'+(id=='moon'?' night':'');
 clean=S[id](pbody)||null;panel.hidden=false;setInert(true);mark(id);closeBtn.focus();sheet.scrollTop=0}
function closePanel(){
 if(!isOpen)return;pt.clear();clean&&clean();clean=null;P=[];panel.hidden=true;pbody.innerHTML='';setInert(false);isOpen=false;last&&last.focus()}
closeBtn.addEventListener('click',closePanel);
panel.addEventListener('click',e=>{if(e.target===panel)closePanel()});
addEventListener('keydown',e=>{if(e.key=='Escape'){finOpen?closeFin():closePanel()}});
$('#items').addEventListener('click',e=>{const b=e.target.closest('.obj');if(!b)return;b.id=='keyBtn'?finale(b):openPanel(b.dataset.id,b)});
$('#finBtn').addEventListener('click',e=>finale(e.currentTarget));
const scroll=el=>el.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
const S={
 env(b){b.innerHTML=`<h2 id="ptitle">${C.obj.env}</h2><div class="paper letter">${C.letter.map(p=>`<p>${p}</p>`).join('')}</div>`},
 jar(b){
  const ord=shuf([0,1,2,3,4,5]),pos=[[24,54],[50,68],[76,52],[35,80],[65,82],[50,38]];let n=0,lock=false;
  b.innerHTML=`<h2 id="ptitle">${C.obj.jar}</h2><p class="prog" id="prog">0 of 6</p><div class="jar"><svg viewBox="0 0 240 250" aria-hidden="true"><rect x="72" y="10" width="96" height="22" rx="6" fill="#c9a36a"/><path d="M78 34h84q52 20 52 70v100q0 34-40 34H66q-40 0-40-34V104q0-50 52-70z" fill="#fff" fill-opacity=".45" stroke="#c9a36a" stroke-width="3"/></svg>${pos.map(p=>`<button class="jh" type="button" style="left:${p[0]}%;top:${p[1]}%;animation-delay:${-Math.random()*2}s" aria-label="Release a heart">${hs('#c9204a')}</button>`).join('')}</div><div id="msgs"></div>`;
  b.querySelectorAll('.jh').forEach(h=>h.addEventListener('click',()=>{
   if(lock||n>5)return;lock=true;pt.add(()=>lock=false,700);
   const [x,y]=centre(h);h.classList.add('out');h.disabled=true;burst(x,y,6,'hs',.4);
   const c=document.createElement('p');c.className='card m'+n;c.textContent=C.jar[ord[n]];$('#msgs').append(c);n++;
   $('#prog').textContent=n<6?`${n} of 6`:'All 6 revealed';pt.add(()=>scroll(c),100)}))},
 moon(b){
  const pts=[[31.7,23],[68.3,23],[19,44],[81,44],[50,85]];let n=0;
  b.innerHTML=`<h2 id="ptitle">${C.obj.moon}</h2><div class="sky" id="sky"><svg viewBox="0 0 300 260" aria-hidden="true"><path class="hp" d="M150 220C40 140 40 60 95 60c30 0 50 20 55 40 5-20 25-40 55-40 55 0 55 80-55 160z"/></svg>${pts.map(p=>`<button class="star" type="button" style="left:${p[0]}%;top:${p[1]}%" aria-label="Star" aria-pressed="false"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/></svg></button>`).join('')}</div><div class="lines" id="lines" aria-live="polite"></div>`;
  b.querySelectorAll('.star').forEach(s=>s.addEventListener('click',()=>{
   if(s.classList.contains('lit'))return;s.classList.add('lit');s.setAttribute('aria-pressed','true');const [x,y]=centre(s);burst(x,y,8,'s',.5);
   const p=document.createElement('p');p.textContent=C.stars[n++];$('#lines').append(p);
   if(n==5){$('#sky').classList.add('done');pt.add(()=>{const q=document.createElement('p');q.className='serif';q.style.fontSize='1.4rem';q.textContent=C.starEnd;$('#lines').append(q);scroll(q)},1700)}else scroll(p)}))},
 gift(b){
  b.innerHTML=`<h2 id="ptitle">${C.obj.gift}</h2><div id="stage" class="center"><button class="pres" type="button" aria-label="Open the present">${ICON.gift}</button></div>`;
  const pr=b.querySelector('.pres');let go=false;
  pr.addEventListener('click',()=>{if(go)return;go=true;pr.classList.add('un');const [x,y]=centre(pr);burst(x,y,30,'hpr',.9);pt.add(()=>{
   $('#stage').innerHTML=`<svg class="hugsvg" id="hs" viewBox="0 0 240 200" aria-hidden="true"><path class="rb r1" d="M40 195C-10 130 30 20 120 40c50 15 70 60 30 100"/><path class="rb r2" d="M200 195c50-65 10-165-80-145-50 15-70 60-30 100"/><g class="hh">${hp(88,66,2,'#b3193f')}</g></svg><p class="msg">${C.hug}</p><button class="btn" id="again" type="button">${C.again}</button>`;
   requestAnimationFrame(()=>$('#hs').classList.add('play'));$('#again').focus();
   $('#again').addEventListener('click',e=>{const h=$('#hs');h.classList.remove('play');void h.getBoundingClientRect();h.classList.add('play');const [x,y]=centre(e.currentTarget);burst(x,y,14,'h',.7)})},RM?0:800)})},
 note(b){
  b.innerHTML=`<h2 id="ptitle">${C.obj.note}</h2><div id="stage" class="center"><button class="pres" type="button" aria-label="Unfold the note">${ICON.note}</button></div>`;
  b.querySelector('.pres').addEventListener('click',()=>{
   $('#stage').innerHTML=`<div class="paper note"><p class="q serif">${C.q}</p><div class="row"><button class="btn" id="yes" type="button">${C.yes}</button><button class="btn alt" id="more" type="button">${C.more}</button></div></div><div id="res" aria-live="polite"></div>`;
   $('#yes').focus();
   $('#yes').addEventListener('click',e=>{const [x,y]=centre(e.currentTarget);burst(x,y,50,'hspr',1);$('#res').innerHTML=`<p class="msg serif">${C.yesRes}</p>`});
   $('#more').addEventListener('click',()=>{
    const fl=`<svg class="flower" viewBox="0 0 120 140" aria-hidden="true"><path d="M60 70v66" stroke="#5f8f5a" stroke-width="6"/><path d="M60 110c20-14 32-8 38-2-14 10-28 8-38 2z" fill="#7aa874"/>${[0,1,2,3,4,5,6,7].map(i=>`<ellipse cx="60" cy="32" rx="13" ry="24" transform="rotate(${i*45} 60 60)" fill="${i%2?'#d9a0a5':'#f0b7bd'}"/>`).join('')}<circle cx="60" cy="60" r="14" fill="#e6c988"/></svg>`;
    $('#res').innerHTML=`<div class="proc">${[0,1,2,3,4].map(i=>`<span class="th" style="animation-delay:${i*.15}s">${hs('#c9204a')}</span>`).join('')}${fl}</div><p class="msg hand" style="font-size:1.9rem;animation-delay:2.4s">${C.moreRes}</p>`;
    scroll($('#res'))})})}
};
/* finale */
function finale(from){
 if(isOpen||finOpen)return;finOpen=true;last=from;setInert(true);
 fin.innerHTML=`<div class="fstage" id="fs"><div class="fedge" aria-hidden="true">${ids.map((id,i)=>`<span style="position:absolute;${['top:8%;left:4%','top:12%;right:4%','top:44%;left:1%','top:48%;right:1%','top:30%;left:38%'][i]}">${ICON[id]}</span>`).join('')}</div>
 <svg class="door" id="door" viewBox="0 0 160 220" aria-hidden="true"><rect x="10" y="10" width="140" height="200" rx="70" fill="#4b2056"/><rect id="lit" x="22" y="24" width="116" height="186" rx="58" fill="#ffe2a8"/><g id="dr"><rect x="22" y="24" width="116" height="186" rx="58" fill="#7a3a6e"/><circle cx="112" cy="130" r="6" fill="#e6c988"/></g><g id="dk"><circle cx="98" cy="130" r="0" fill="none"/><path d="M84 130h30" stroke="#e6c988" stroke-width="5" stroke-linecap="round"/><circle cx="82" cy="130" r="7" fill="none" stroke="#e6c988" stroke-width="4"/></g></svg>
 <div class="hf" id="hf" aria-hidden="true"></div>
 <div class="fmsg" id="fm"><p class="serif">${C.final.join('<br>')}</p><p class="s">${C.finalSub}</p><button class="btn" id="explore" type="button">${C.explore}</button></div></div>`;
 fin.hidden=false;fin.scrollTop=0;fin.focus();
 const fs=$('#fs'),hf=$('#hf'),ft=timers();pt.clear();
 ft.add(()=>fs.classList.add('turn'),500);
 ft.add(()=>fs.classList.add('open'),1900);
 ft.add(()=>fs.classList.add('edges'),2800);
 ft.add(()=>{fs.classList.remove('edges');fs.classList.add('edges2')},5200);
 ft.add(()=>{
  const N=RM?24:Math.max(16,Math.round(34*perf)),cols=['#b3193f','#d9587a','#e6a0b0','#9d8bc4','#d4a94e'];
  for(let i=0;i<N;i++){const t=i/N*6.283,x=16*Math.sin(t)**3,y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
   const s=document.createElement('span');s.textContent='♥';s.style.color=cols[i%5];s.style.left=(15+Math.random()*70)+'%';s.style.top='115%';s.style.transitionDelay=(i*.05)+'s';hf.append(s);
   requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.opacity=1;s.style.left=(50+x*2.6)+'%';s.style.top=(46-y*2.4)+'%'}))}
 },3000);
 ft.add(()=>{$('#fm').classList.add('show');$('#explore').focus();scroll($('#fm'))},6400);
 fin._t=ft;$('#explore').addEventListener('click',closeFin);
}
function closeFin(){
 if(!finOpen)return;fin._t&&fin._t.clear();P=[];fin.hidden=true;fin.innerHTML='';finOpen=false;setInert(false);last&&last.focus()}
</script>
</body>
