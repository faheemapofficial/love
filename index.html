<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>A Surprise</title>
  <style>
    /* ---------- RESET ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      background: #2b0a1a;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
      position: relative;
      transition: background 1.2s ease;
    }

    /* Background states */
    body.state-dark {
      background: #2b0a1a;
    }

    body.state-reveal {
      background: radial-gradient(circle at 30% 20%, #ffe4ec 0%, #fff1e8 55%, #fde2e8 100%);
    }

    /* ---------- CANVAS (particles) ---------- */
    #particleCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }

    /* ---------- AMBIENT SPARKLES (dark phase) ---------- */
    .ambient-sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      transition: opacity 1s ease;
    }

    .ambient-sparkles.fade-out {
      opacity: 0;
    }

    .sparkle-dot {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #ffd7e6;
      box-shadow: 0 0 6px 2px rgba(255, 200, 220, 0.5);
      animation: twinkle 3s infinite ease-in-out;
      opacity: 0.3;
    }

    @keyframes twinkle {
      0% { opacity: 0.1; transform: scale(0.8); }
      50% { opacity: 0.6; transform: scale(1.2); }
      100% { opacity: 0.1; transform: scale(0.8); }
    }

    /* ---------- APP CONTAINER ---------- */
    #app {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ---------- INITIAL SCREEN ---------- */
    #initialScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      z-index: 20;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #initialScreen.hidden {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
      position: absolute;
      visibility: hidden;
    }

    /* Small glowing heart button */
    .heart-btn {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 35% 30%, #ff9eb5, #c94060 80%);
      box-shadow:
        0 0 0 6px rgba(255, 150, 180, 0.25),
        0 0 30px 8px rgba(220, 80, 120, 0.5),
        0 0 60px 16px rgba(200, 60, 100, 0.3),
        inset 0 -4px 12px rgba(130, 20, 50, 0.5),
        inset 0 6px 16px rgba(255, 200, 220, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.3s ease;
      animation: heartbeat 1.8s infinite ease-in-out;
      will-change: transform;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .heart-btn:focus-visible {
      outline: 3px solid #ffb3c6;
      outline-offset: 10px;
    }

    .heart-btn:active {
      transform: scale(0.9);
    }

    .heart-btn-label {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: #fff0f5;
      text-shadow: 0 1px 8px rgba(160, 40, 70, 0.8), 0 0 14px rgba(255, 180, 200, 0.8);
      text-transform: uppercase;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      12% { transform: scale(1.12); }
      24% { transform: scale(1); }
      36% { transform: scale(1.12); }
      48% { transform: scale(1); }
      100% { transform: scale(1); }
    }

    /* ---------- FINAL SCREEN ---------- */
    #finalScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem;
      z-index: 30;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.9s ease, visibility 0s 0.9s;
      pointer-events: none;
    }

    #finalScreen.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.9s ease, visibility 0s 0s;
    }

    /* Constellation frame */
    .constellation {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .constellation-star {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ffd7e6;
      box-shadow: 0 0 8px 3px rgba(255, 200, 220, 0.7);
      opacity: 0.6;
      animation: constellationPulse 4s infinite ease-in-out;
    }

    @keyframes constellationPulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }

    /* Falling petals */
    .falling-petals {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .falling-petal {
      position: absolute;
      font-size: 1.2rem;
      opacity: 0.45;
      animation: fallDown linear infinite;
      will-change: transform, opacity;
      user-select: none;
    }

    @keyframes fallDown {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* Glass card */
    .glass-card {
      position: relative;
      z-index: 10;
      max-width: 520px;
      width: 100%;
      padding: 3rem 2rem 3.2rem;
      background: rgba(255, 245, 240, 0.3);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border-radius: 56px;
      border: 1px solid rgba(255, 215, 215, 0.7);
      box-shadow:
        0 25px 55px -10px rgba(190, 90, 120, 0.25),
        0 0 0 1px rgba(255, 235, 235, 0.4) inset,
        0 8px 24px rgba(255, 210, 220, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .card-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(235, 120, 150, 0.28) 0%, rgba(255, 160, 180, 0) 70%);
      border-radius: 50%;
      filter: blur(35px);
      z-index: 0;
      pointer-events: none;
      animation: glowPulse 4s infinite ease-in-out;
    }

    @keyframes glowPulse {
      0% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.95; transform: translate(-50%, -50%) scale(1.12); }
      100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    }

    .final-safa {
      position: relative;
      z-index: 10;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(3.8rem, 15vw, 5.6rem);
      color: #7a2f45;
      text-shadow: 0 4px 24px rgba(255, 200, 215, 0.9), 0 2px 16px rgba(200, 100, 130, 0.25);
      letter-spacing: 2px;
      margin-bottom: 0.2rem;
      opacity: 0;
      animation: fadeSlideIn 1.1s 0.1s ease forwards;
    }

    .final-love {
      position: relative;
      z-index: 10;
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
      font-weight: 300;
      font-size: clamp(1.7rem, 7vw, 2.2rem);
      letter-spacing: 2px;
      color: #a1445e;
      text-shadow: 0 2px 14px rgba(255, 220, 225, 0.8);
      margin-top: 0.6rem;
      opacity: 0;
      animation: fadeSlideIn 1.1s 1.4s ease forwards;
    }

    .final-miss {
      position: relative;
      z-index: 10;
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
      font-weight: 300;
      font-size: clamp(1.6rem, 6.5vw, 2.1rem);
      letter-spacing: 2px;
      color: #b1576e;
      text-shadow: 0 2px 14px rgba(255, 220, 225, 0.8);
      margin-top: 0.3rem;
      opacity: 0;
      animation: fadeSlideIn 1.1s 2.3s ease forwards;
    }

    @keyframes fadeSlideIn {
      0% { opacity: 0; transform: translateY(14px); filter: blur(2px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* Replay button */
    .replay-btn {
      position: relative;
      z-index: 20;
      margin-top: 2.4rem;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 35% 30%, #ffb3c6, #d94a6e 75%);
      box-shadow:
        0 0 0 4px rgba(255, 200, 215, 0.35),
        0 6px 18px rgba(200, 80, 110, 0.4),
        0 0 28px rgba(235, 100, 140, 0.35),
        inset 0 -4px 10px rgba(160, 40, 70, 0.3),
        inset 0 6px 14px rgba(255, 220, 230, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.3s ease;
      outline: none;
      opacity: 0;
      animation: fadeSlideIn 0.8s 2.6s ease forwards;
    }

    .replay-btn:focus-visible {
      outline: 3px solid #d45d79;
      outline-offset: 5px;
    }

    .replay-btn:active {
      transform: scale(0.88);
    }

    .replay-btn svg {
      width: 26px;
      height: 26px;
      fill: #fff0f5;
      filter: drop-shadow(0 0 8px #ffb0c3);
    }

    /* ---------- HEART BURST FROM TAPS ---------- */
    .tap-burst-heart {
      position: fixed;
      pointer-events: none;
      z-index: 50;
      font-size: 1.4rem;
      color: #e05a7a;
      filter: drop-shadow(0 0 8px #ffb0c3);
      will-change: transform, opacity;
    }

    /* ---------- REDUCED MOTION ---------- */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .heart-btn { animation: none; }
      .ambient-sparkles { display: none; }
      #particleCanvas { display: none; }
      .final-safa, .final-love, .final-miss, .replay-btn { opacity: 1; animation: none; }
      .card-glow { animation: none; }
      .falling-petal { animation: none; opacity: 0.2; }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 420px) {
      .glass-card {
        padding: 2.4rem 1.4rem 2.6rem;
        border-radius: 46px;
      }
      .heart-btn {
        width: 100px;
        height: 100px;
      }
      .heart-btn-label {
        font-size: 0.85rem;
        letter-spacing: 1.5px;
      }
      .replay-btn {
        width: 50px;
        height: 50px;
      }
      .replay-btn svg {
        width: 22px;
        height: 22px;
      }
    }

    img, canvas, svg { max-width: 100%; }

    /* Hide overflow for cinematic reveal */
    body.reveal-active {
      overflow: hidden;
    }
  </style>
</head>
<body class="state-dark">
  <!-- Ambient sparkles (dark phase) -->
  <div class="ambient-sparkles" id="ambientSparkles" aria-hidden="true">
    <div class="sparkle-dot" style="left: 8%; top: 12%; animation-delay: 0s;"></div>
    <div class="sparkle-dot" style="left: 92%; top: 18%; animation-delay: 0.7s;"></div>
    <div class="sparkle-dot" style="left: 15%; top: 78%; animation-delay: 1.4s;"></div>
    <div class="sparkle-dot" style="left: 85%; top: 82%; animation-delay: 2.1s;"></div>
    <div class="sparkle-dot" style="left: 50%; top: 6%; animation-delay: 0.4s;"></div>
    <div class="sparkle-dot" style="left: 25%; top: 45%; animation-delay: 1.1s;"></div>
    <div class="sparkle-dot" style="left: 75%; top: 55%; animation-delay: 1.8s;"></div>
    <div class="sparkle-dot" style="left: 5%; top: 35%; animation-delay: 2.4s;"></div>
    <div class="sparkle-dot" style="left: 95%; top: 65%; animation-delay: 0.9s;"></div>
    <div class="sparkle-dot" style="left: 60%; top: 90%; animation-delay: 1.6s;"></div>
    <div class="sparkle-dot" style="left: 40%; top: 25%; animation-delay: 2.8s;"></div>
    <div class="sparkle-dot" style="left: 70%; top: 8%; animation-delay: 0.2s;"></div>
  </div>

  <!-- Particle canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- App -->
  <div id="app">
    <!-- INITIAL SCREEN -->
    <div id="initialScreen">
      <button 
        class="heart-btn" 
        id="heartBtn" 
        aria-label="Tap here to begin the surprise"
        type="button"
      >
        <span class="heart-btn-label">Tap here</span>
      </button>
    </div>

    <!-- FINAL SCREEN -->
    <div id="finalScreen">
      <!-- Constellation stars -->
      <div class="constellation" id="constellation" aria-hidden="true"></div>
      
      <!-- Falling petals -->
      <div class="falling-petals" id="fallingPetals" aria-hidden="true"></div>

      <div class="glass-card">
        <div class="card-glow" aria-hidden="true"></div>
        <div class="final-safa">Safa</div>
        <div class="final-love">I love you</div>
        <div class="final-miss">I miss you</div>
        <button 
          class="replay-btn" 
          id="replayBtn" 
          aria-label="Replay the surprise"
          type="button"
        >
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ---------- DOM ----------
      const body = document.body;
      const initialScreen = document.getElementById('initialScreen');
      const finalScreen = document.getElementById('finalScreen');
      const heartBtn = document.getElementById('heartBtn');
      const replayBtn = document.getElementById('replayBtn');
      const ambientSparkles = document.getElementById('ambientSparkles');
      const constellation = document.getElementById('constellation');
      const fallingPetals = document.getElementById('fallingPetals');
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');

      // ---------- State ----------
      let isRevealed = false;
      let isAnimating = false;
      let particles = [];
      let animationFrameId = null;
      let canvasWidth = 0;
      let canvasHeight = 0;
      let dpr = 1;
      let phase = 'dark'; // 'dark' | 'forming' | 'burst' | 'reveal'

      // Reduced motion
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ---------- Canvas setup ----------
      function resizeCanvas() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = canvasWidth * dpr;
        canvas.height = canvasHeight * dpr;
        canvas.style.width = canvasWidth + 'px';
        canvas.style.height = canvasHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', () => {
        resizeCanvas();
      });
      resizeCanvas();

      // ---------- Particle colours ----------
      const COLORS = [
        '#ff6b8a', '#ff8fa3', '#ffb3c6', '#e05a7a', '#c94f6d',
        '#f9a8b7', '#ffc0cb', '#ffd700', '#ffe066', '#ffb347',
        '#ff4d6d', '#ff758f', '#d45d79', '#b1576e', '#ffc2d1',
        '#ff9eb5', '#e8a0b8'
      ];

      // ---------- Particle creation ----------
      function createParticle(x, y, type, opts) {
        const angle = opts?.angle ?? (Math.random() * Math.PI * 2);
        const speed = opts?.speed ?? (1.5 + Math.random() * 6);
        const size = type === 'sparkle' ? (2 + Math.random() * 5) : (5 + Math.random() * 12);
        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
        const life = 1.0;
        const decay = opts?.decay ?? (0.007 + Math.random() * 0.01);

        return {
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (opts?.upBias ?? 2),
          size,
          color,
          life,
          decay,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.15,
          type,
          gravity: type === 'confetti' ? 0.08 : 0.02,
          drag: 0.985,
          wobble: Math.random() * 10,
          wobbleSpeed: 0.03 + Math.random() * 0.05,
          targetX: opts?.targetX,
          targetY: opts?.targetY,
          swirl: opts?.swirl ?? 0,
          formProgress: 0
        };
      }

      // ---------- Drawing helpers ----------
      function drawHeart(ctx, x, y, size, color, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.scale(size / 20, size / 20);
        ctx.beginPath();
        ctx.moveTo(0, -6);
        ctx.bezierCurveTo(-10, -16, -20, -2, 0, 12);
        ctx.bezierCurveTo(20, -2, 10, -16, 0, -6);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }

      function drawPetal(ctx, x, y, size, color, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.beginPath();
        ctx.ellipse(0, 0, size * 0.5, size * 0.28, 0, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-size * 0.1, -size * 0.05, size * 0.12, size * 0.08, 0.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fill();
        ctx.restore();
      }

      function drawSparkle(ctx, x, y, size, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.beginPath();
        const s = size * 0.5;
        ctx.moveTo(0, -s * 1.8);
        ctx.lineTo(s * 0.4, -s * 0.4);
        ctx.lineTo(s * 1.8, 0);
        ctx.lineTo(s * 0.4, s * 0.4);
        ctx.lineTo(0, s * 1.8);
        ctx.lineTo(-s * 0.4, s * 0.4);
        ctx.lineTo(-s * 1.8, 0);
        ctx.lineTo(-s * 0.4, -s * 0.4);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 16;
        ctx.fill();
        ctx.restore();
      }

      function drawConfetti(ctx, x, y, size, color, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 6;
        ctx.fillRect(-size * 0.4, -size * 0.15, size * 0.8, size * 0.3);
        ctx.restore();
      }

      // ---------- Animation loop ----------
      function updateAndDrawParticles() {
        if (prefersReducedMotion) {
          ctx.clearRect(0, 0, canvasWidth, canvasHeight);
          return;
        }

        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];

          // Phase-specific physics
          if (phase === 'forming' && p.targetX !== undefined) {
            // Swirl towards center
            p.formProgress += 0.012;
            const dx = p.targetX - p.x;
            const dy = p.targetY - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 2) {
              const pull = 0.04 * p.formProgress;
              p.vx += (dx / dist) * pull;
              p.vy += (dy / dist) * pull;
              // Swirl
              if (p.swirl) {
                p.vx += -dy / dist * p.swirl * 0.02;
                p.vy += dx / dist * p.swirl * 0.02;
              }
            }
            p.vx *= 0.96;
            p.vy *= 0.96;
          } else {
            // Normal physics
            p.vy += p.gravity;
            p.vx *= p.drag;
            p.vy *= p.drag;
          }

          p.x += p.vx;
          p.y += p.vy;
          p.rotation += p.rotationSpeed;
          p.life -= p.decay;
          p.wobble += p.wobbleSpeed;

          if (p.life <= 0 || p.y > canvasHeight + 150 || p.x < -150 || p.x > canvasWidth + 150) {
            particles.splice(i, 1);
            continue;
          }

          const wobbleX = Math.sin(p.wobble) * 0.8;
          const drawX = p.x + wobbleX;
          const drawY = p.y;

          ctx.globalAlpha = Math.min(p.life * 1.2, 1);

          switch (p.type) {
            case 'heart':   drawHeart(ctx, drawX, drawY, p.size, p.color, p.rotation); break;
            case 'petal':   drawPetal(ctx, drawX, drawY, p.size, p.color, p.rotation); break;
            case 'sparkle': drawSparkle(ctx, drawX, drawY, p.size, p.color); break;
            case 'confetti':drawConfetti(ctx, drawX, drawY, p.size, p.color, p.rotation); break;
          }
        }
        ctx.globalAlpha = 1;

        if (particles.length > 0) {
          animationFrameId = requestAnimationFrame(updateAndDrawParticles);
        } else {
          animationFrameId = null;
        }
      }

      function startParticleLoop() {
        if (prefersReducedMotion) return;
        if (animationFrameId) return;
        if (particles.length > 0) {
          animationFrameId = requestAnimationFrame(updateAndDrawParticles);
        }
      }

      // ---------- Build constellation ----------
      function buildConstellation() {
        constellation.innerHTML = '';
        const count = 28;
        const positions = [];

        // Generate heart-shaped constellation
        for (let i = 0; i < count; i++) {
          const t = (i / count) * Math.PI * 2;
          // Heart parametric equation
          const hx = 16 * Math.pow(Math.sin(t), 3);
          const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
          
          const scale = Math.min(canvasWidth, canvasHeight) * 0.011;
          const cx = canvasWidth / 2;
          const cy = canvasHeight / 2;
          
          const x = cx + hx * scale * 1.1;
          const y = cy + hy * scale * 1.1;
          
          positions.push({ x, y });
        }

        // Add stars at heart positions with slight randomization
        positions.forEach((pos, i) => {
          const star = document.createElement('div');
          star.className = 'constellation-star';
          star.style.left = (pos.x + (Math.random() - 0.5) * 12) + 'px';
          star.style.top = (pos.y + (Math.random() - 0.5) * 12) + 'px';
          star.style.animationDelay = (i * 0.15) + 's';
          constellation.appendChild(star);
        });

        // Add a few extra stars for depth
        for (let i = 0; i < 12; i++) {
          const star = document.createElement('div');
          star.className = 'constellation-star';
          star.style.left = (Math.random() * 100) + '%';
          star.style.top = (Math.random() * 100) + '%';
          star.style.opacity = 0.3 + Math.random() * 0.3;
          star.style.animationDelay = (Math.random() * 4) + 's';
          star.style.width = (2 + Math.random() * 3) + 'px';
          star.style.height = star.style.width;
          constellation.appendChild(star);
        }
      }

      // ---------- Build falling petals ----------
      function buildFallingPetals() {
        fallingPetals.innerHTML = '';
        const petalCount = 14;
        for (let i = 0; i < petalCount; i++) {
          const petal = document.createElement('div');
          petal.className = 'falling-petal';
          petal.textContent = '🌸';
          petal.style.left = (Math.random() * 100) + '%';
          petal.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
          petal.style.animationDuration = (10 + Math.random() * 14) + 's';
          petal.style.animationDelay = (Math.random() * 12) + 's';
          petal.style.opacity = 0.25 + Math.random() * 0.3;
          fallingPetals.appendChild(petal);
        }
      }

      // ---------- CINEMATIC REVEAL SEQUENCE ----------
      function startReveal() {
        if (isRevealed || isAnimating) return;
        isAnimating = true;

        // Phase 1: Button contracts + background dims (500ms)
        heartBtn.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.5s ease, opacity 0.5s ease';
        heartBtn.style.transform = 'scale(0.05)';
        heartBtn.style.opacity = '0';
        heartBtn.style.boxShadow = '0 0 20px 5px rgba(255, 150, 180, 0.6)';
        
        // Dim the background
        body.style.transition = 'background 0.5s ease';
        body.style.background = '#1a0510';

        // Fade ambient sparkles
        ambientSparkles.classList.add('fade-out');

        // Hide initial screen after contraction
        setTimeout(() => {
          initialScreen.classList.add('hidden');
        }, 400);

        // Phase 2: Particles swirl to form heart (after 500ms, lasts ~1.5s)
        setTimeout(() => {
          if (prefersReducedMotion) {
            // Skip particle formation, go straight to reveal
            finishReveal();
            return;
          }

          phase = 'forming';
          particles = [];

          const centerX = canvasWidth / 2;
          const centerY = canvasHeight / 2;
          const heartScale = Math.min(canvasWidth, canvasHeight) * 0.012;

          // Create ~120 particles that swirl to heart positions
          const particleCount = Math.min(140, Math.floor((canvasWidth * canvasHeight) / 8000));
          
          for (let i = 0; i < particleCount; i++) {
            const t = (i / particleCount) * Math.PI * 2;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            
            const targetX = centerX + hx * heartScale * 1.1;
            const targetY = centerY + hy * heartScale * 1.1;

            // Start from random edge positions
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.max(canvasWidth, canvasHeight) * (0.6 + Math.random() * 0.5);
            const startX = centerX + Math.cos(angle) * dist;
            const startY = centerY + Math.sin(angle) * dist;

            const typeRoll = Math.random();
            let type;
            if (typeRoll < 0.35) type = 'heart';
            else if (typeRoll < 0.55) type = 'petal';
            else if (typeRoll < 0.75) type = 'sparkle';
            else type = 'confetti';

            const p = createParticle(startX, startY, type, {
              targetX: targetX + (Math.random() - 0.5) * 15,
              targetY: targetY + (Math.random() - 0.5) * 15,
              speed: 1 + Math.random() * 2,
              decay: 0.002 + Math.random() * 0.002,
              swirl: 0.5 + Math.random() * 1.5,
              upBias: 0
            });
            p.swirl = 0.5 + Math.random() * 2;
            particles.push(p);
          }

          startParticleLoop();

          // Phase 3: After formation, pulse twice then burst
          setTimeout(() => {
            // Store heart positions for pulse
            const heartParticles = particles.slice();
            
            // Pulse 1 - expand
            setTimeout(() => {
              heartParticles.forEach(p => {
                p.targetX = canvasWidth / 2 + (p.targetX - canvasWidth / 2) * 1.25;
                p.targetY = canvasHeight / 2 + (p.targetY - canvasHeight / 2) * 1.25;
              });
            }, 0);

            // Pulse 1 - contract
            setTimeout(() => {
              heartParticles.forEach(p => {
                p.targetX = canvasWidth / 2 + (p.targetX - canvasWidth / 2) / 1.25;
                p.targetY = canvasHeight / 2 + (p.targetY - canvasHeight / 2) / 1.25;
              });
            }, 250);

            // Pulse 2 - expand
            setTimeout(() => {
              heartParticles.forEach(p => {
                p.targetX = canvasWidth / 2 + (p.targetX - canvasWidth / 2) * 1.25;
                p.targetY = canvasHeight / 2 + (p.targetY - canvasHeight / 2) * 1.25;
              });
            }, 500);

            // Pulse 2 - contract
            setTimeout(() => {
              heartParticles.forEach(p => {
                p.targetX = canvasWidth / 2 + (p.targetX - canvasWidth / 2) / 1.25;
                p.targetY = canvasHeight / 2 + (p.targetY - canvasHeight / 2) / 1.25;
              });
            }, 750);

            // Phase 4: BURST! (after ~1.5s of formation)
            setTimeout(() => {
              phase = 'burst';
              
              // Convert all particles to burst particles
              particles.forEach(p => {
                p.targetX = undefined;
                p.targetY = undefined;
                p.swirl = 0;
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 8;
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed - 3;
                p.decay = 0.006 + Math.random() * 0.01;
                p.gravity = p.type === 'confetti' ? 0.1 : 0.03;
                p.drag = 0.985;
              });

              // Add extra particles for the burst
              const extraCount = Math.min(160, Math.floor((canvasWidth * canvasHeight) / 6000));
              const centerX = canvasWidth / 2;
              const centerY = canvasHeight / 2;

              for (let i = 0; i < extraCount; i++) {
                const typeRoll = Math.random();
                let type;
                if (typeRoll < 0.4) type = 'heart';
                else if (typeRoll < 0.62) type = 'petal';
                else if (typeRoll < 0.82) type = 'sparkle';
                else type = 'confetti';

                particles.push(createParticle(
                  centerX + (Math.random() - 0.5) * 50,
                  centerY + (Math.random() - 0.5) * 50,
                  type,
                  { speed: 4 + Math.random() * 8, upBias: 2 }
                ));
              }

              // Start background transition to blush
              body.classList.remove('state-dark');
              body.classList.add('state-reveal');
              body.style.background = '';

              // Phase 5: Reveal the message
              setTimeout(() => {
                finishReveal();
              }, 400);

            }, 1600);

          }, 100);

        }, 500);
      }

      function finishReveal() {
        // Show final screen
        finalScreen.classList.add('visible');
        isRevealed = true;
        isAnimating = false;

        // Build decorations
        buildConstellation();
        buildFallingPetals();

        // Start gentle ambient particle loop for floating hearts
        if (!prefersReducedMotion) {
          // Spawn a few gentle hearts periodically
          setInterval(() => {
            if (particles.length < 40 && isRevealed) {
              const x = Math.random() * canvasWidth;
              const y = canvasHeight + 20;
              const p = createParticle(x, y, 'heart', {
                speed: 0.5 + Math.random() * 1,
                upBias: 1 + Math.random() * 1.5,
                decay: 0.003 + Math.random() * 0.003
              });
              p.gravity = -0.005;
              p.vx = (Math.random() - 0.5) * 0.5;
              particles.push(p);
              startParticleLoop();
            }
          }, 1800);
        }
      }

      // ---------- Reset to initial ----------
      function resetToInitial() {
        if (isAnimating) return;
        isAnimating = true;

        // Hide final screen
        finalScreen.classList.remove('visible');

        // Clear particles
        particles = [];
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        // Reset background
        body.classList.remove('state-reveal');
        body.classList.add('state-dark');
        body.style.background = '';

        // Reset ambient sparkles
        ambientSparkles.classList.remove('fade-out');

        // Reset button
        heartBtn.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.5s ease, opacity 0.5s ease';
        heartBtn.style.transform = 'scale(1)';
        heartBtn.style.opacity = '1';
        heartBtn.style.boxShadow = '';

        // Show initial screen
        setTimeout(() => {
          initialScreen.classList.remove('hidden');
          isRevealed = false;
          isAnimating = false;
          phase = 'dark';
        }, 400);
      }

      // ---------- Tap-to-burst on empty areas (final screen) ----------
      function handleTapBurst(e) {
        if (!isRevealed || prefersReducedMotion) return;
        
        // Don't trigger on replay button
        if (e.target.closest('.replay-btn')) return;
        
        // Don't trigger on glass card content (only empty areas)
        if (e.target.closest('.glass-card')) return;

        const x = e.clientX || (e.touches && e.touches[0].clientX);
        const y = e.clientY || (e.touches && e.touches[0].clientY);
        if (x === undefined || y === undefined) return;

        // Spawn a small burst of hearts
        for (let i = 0; i < 8; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 3;
          const p = createParticle(x, y, 'heart', {
            angle,
            speed,
            upBias: 1 + Math.random() * 2,
            decay: 0.01 + Math.random() * 0.015
          });
          p.size = 4 + Math.random() * 6;
          particles.push(p);
        }
        startParticleLoop();

        // Also create DOM hearts for immediate feedback
        for (let i = 0; i < 5; i++) {
          const heart = document.createElement('div');
          heart.className = 'tap-burst-heart';
          heart.textContent = '❤️';
          heart.style.left = x + 'px';
          heart.style.top = y + 'px';
          heart.style.fontSize = (0.8 + Math.random() * 0.8) + 'rem';
          
          const tx = (Math.random() - 0.5) * 120;
          const ty = -40 - Math.random() * 80;
          
          heart.style.transition = 'transform 0.9s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.9s ease';
          heart.style.transform = 'translate(0, 0) scale(1)';
          heart.style.opacity = '1';
          
          document.body.appendChild(heart);
          
          requestAnimationFrame(() => {
            heart.style.transform = `translate(${tx}px, ${ty}px) scale(0.3)`;
            heart.style.opacity = '0';
          });
          
          setTimeout(() => {
            if (heart.parentNode) heart.remove();
          }, 950);
        }
      }

      // ---------- Event listeners ----------
      heartBtn.addEventListener('click', startReveal);

      replayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        resetToInitial();
      });

      // Tap-to-burst on document (only when final screen visible)
      document.addEventListener('click', handleTapBurst);

      // Prevent double-tap zoom on buttons
      [heartBtn, replayBtn].forEach(btn => {
        btn.addEventListener('touchstart', () => {}, { passive: true });
        btn.addEventListener('contextmenu', (e) => e.preventDefault());
      });

      // ---------- Init ----------
      body.classList.add('state-dark');
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      // If reduced motion, we skip the full cinematic and show a gentle reveal
      if (prefersReducedMotion) {
        // Override startReveal with a simple fade
        heartBtn.addEventListener('click', function simpleReveal() {
          if (isRevealed || isAnimating) return;
          isAnimating = true;
          
          initialScreen.classList.add('hidden');
          body.classList.remove('state-dark');
          body.classList.add('state-reveal');
          
          setTimeout(() => {
            finalScreen.classList.add('visible');
            isRevealed = true;
            isAnimating = false;
            buildConstellation();
            buildFallingPetals();
          }, 300);
        }, { once: true });
      }

    })();
  </script>
</body>
</html>
