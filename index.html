<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Safa · A Surprise</title>
  <style>
    /* ---------- RESET & GLOBAL ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #fff0f5;
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 20%, #ffe4ec 0%, #fff1e8 60%, #fde2e8 100%);
      position: relative;
    }

    /* ---------- DECORATIVE BLURRED PETALS (background) ---------- */
    .blur-petal {
      position: fixed;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
      background: #ffb6c1;
    }
    .petal1 { top: -60px; left: -40px; width: 220px; height: 220px; background: #ffc0cb; }
    .petal2 { bottom: -70px; right: -30px; width: 280px; height: 280px; background: #f9a8b7; }
    .petal3 { top: 15%; right: 2%; width: 150px; height: 150px; background: #fcc2d7; filter: blur(60px); }
    .petal4 { bottom: 15%; left: 3%; width: 190px; height: 190px; background: #fadadd; filter: blur(55px); }

    /* ---------- FLOATING HEARTS (ambient) ---------- */
    .ambient-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }
    .ambient-heart {
      position: absolute;
      color: #d45d79;
      opacity: 0.3;
      animation: floatAmbient 14s infinite ease-in-out;
      will-change: transform, opacity;
      filter: drop-shadow(0 4px 8px rgba(199, 80, 110, 0.15));
      user-select: none;
    }
    .ambient-heart:nth-child(1) { left: 6%; top: 12%; font-size: 1.2rem; animation-duration: 16s; animation-delay: 0s; }
    .ambient-heart:nth-child(2) { left: 90%; top: 75%; font-size: 1.6rem; animation-duration: 18s; animation-delay: 2s; }
    .ambient-heart:nth-child(3) { left: 15%; top: 85%; font-size: 0.9rem; animation-duration: 14s; animation-delay: 1s; }
    .ambient-heart:nth-child(4) { left: 80%; top: 10%; font-size: 1.4rem; animation-duration: 20s; animation-delay: 3s; }
    .ambient-heart:nth-child(5) { left: 50%; top: 6%; font-size: 1rem; animation-duration: 17s; animation-delay: 0.5s; }
    .ambient-heart:nth-child(6) { left: 95%; top: 40%; font-size: 1.1rem; animation-duration: 19s; animation-delay: 4s; }
    .ambient-heart:nth-child(7) { left: 4%; top: 55%; font-size: 1.3rem; animation-duration: 15s; animation-delay: 5s; }

    @keyframes floatAmbient {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.2; }
      50% { transform: translateY(-28px) rotate(8deg) scale(1.1); opacity: 0.45; }
      100% { transform: translateY(-60px) rotate(-6deg) scale(0.9); opacity: 0; }
    }

    /* ---------- APP CONTAINER ---------- */
    #app {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ---------- INITIAL SCREEN (only button) ---------- */
    #initialScreen {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      z-index: 20;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #initialScreen.hidden {
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none;
      position: absolute;
      visibility: hidden;
    }

    /* ---------- HEART BUTTON (glowing, labelled "Tap here") ---------- */
    .heart-btn {
      position: relative;
      width: clamp(170px, 48vw, 220px);
      height: clamp(170px, 48vw, 220px);
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 35% 30%, #ffb3c6, #e05a7a 75%);
      box-shadow: 
        0 0 0 8px rgba(255, 200, 215, 0.35),
        0 20px 45px -8px rgba(200, 80, 110, 0.5),
        0 0 60px rgba(235, 100, 140, 0.6),
        inset 0 -8px 18px rgba(160, 40, 70, 0.4),
        inset 0 10px 28px rgba(255, 220, 230, 0.8);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      transition: transform 0.15s ease, box-shadow 0.3s ease;
      animation: heartbeat 1.8s infinite ease-in-out;
      will-change: transform;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
      padding: 0;
    }

    .heart-btn:focus-visible {
      outline: 3px solid #d45d79;
      outline-offset: 10px;
    }

    .heart-btn:active {
      transform: scale(0.93);
    }

    .heart-icon {
      font-size: clamp(3.4rem, 15vw, 4.8rem);
      line-height: 1;
      color: #fff0f5;
      text-shadow: 0 0 20px #ffb0c3, 0 4px 14px rgba(180, 50, 80, 0.5);
      filter: drop-shadow(0 0 10px rgba(255, 180, 200, 0.8));
    }

    .heart-label {
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
      font-weight: 400;
      font-size: clamp(0.95rem, 3.8vw, 1.2rem);
      letter-spacing: 3px;
      color: #fff0f5;
      text-shadow: 0 2px 10px rgba(160, 40, 70, 0.6), 0 0 18px rgba(255, 180, 200, 0.7);
      text-transform: uppercase;
      margin-top: -0.2rem;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      12% { transform: scale(1.1); }
      24% { transform: scale(1); }
      36% { transform: scale(1.1); }
      48% { transform: scale(1); }
      100% { transform: scale(1); }
    }

    /* ---------- FINAL SCREEN (glass card) ---------- */
    #finalScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem;
      z-index: 30;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0s 0.8s;
      pointer-events: none;
    }

    #finalScreen.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.8s ease, visibility 0s 0s;
    }

    .glass-card {
      position: relative;
      max-width: 520px;
      width: 100%;
      padding: 3rem 2rem 3.2rem;
      background: rgba(255, 245, 240, 0.35);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border-radius: 56px;
      border: 1px solid rgba(255, 215, 215, 0.75);
      box-shadow: 
        0 25px 55px -10px rgba(190, 90, 120, 0.3),
        0 0 0 1px rgba(255, 235, 235, 0.5) inset,
        0 8px 24px rgba(255, 210, 220, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    /* glowing heart behind text */
    .card-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(235, 120, 150, 0.3) 0%, rgba(255, 160, 180, 0) 70%);
      border-radius: 50%;
      filter: blur(35px);
      z-index: 0;
      pointer-events: none;
      animation: glowPulse 4s infinite ease-in-out;
    }

    @keyframes glowPulse {
      0% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.95; transform: translate(-50%, -50%) scale(1.12); }
      100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    }

    .final-safa {
      position: relative;
      z-index: 10;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(3.6rem, 14vw, 5.2rem);
      color: #8a3b52;
      text-shadow: 0 4px 20px rgba(255, 200, 215, 0.9), 0 2px 14px rgba(200, 100, 130, 0.3);
      letter-spacing: 2px;
      margin-bottom: 0.3rem;
      opacity: 0;
      animation: fadeSlideIn 0.9s 0.1s ease forwards;
    }

    .final-love {
      position: relative;
      z-index: 10;
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
      font-weight: 300;
      font-size: clamp(1.7rem, 7vw, 2.2rem);
      letter-spacing: 2px;
      color: #a1445e;
      text-shadow: 0 2px 12px rgba(255, 220, 225, 0.8);
      margin-top: 0.6rem;
      opacity: 0;
      animation: fadeSlideIn 0.9s 0.8s ease forwards;
    }

    .final-miss {
      position: relative;
      z-index: 10;
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
      font-weight: 300;
      font-size: clamp(1.6rem, 6.5vw, 2.1rem);
      letter-spacing: 2px;
      color: #b1576e;
      text-shadow: 0 2px 12px rgba(255, 220, 225, 0.8);
      margin-top: 0.3rem;
      opacity: 0;
      animation: fadeSlideIn 0.9s 1.5s ease forwards;
    }

    @keyframes fadeSlideIn {
      0% { opacity: 0; transform: translateY(12px); filter: blur(2px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* ---------- REPLAY BUTTON (small heart) ---------- */
    .replay-btn {
      position: relative;
      z-index: 20;
      margin-top: 2.2rem;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 35% 30%, #ffb3c6, #e05a7a 75%);
      box-shadow: 
        0 0 0 4px rgba(255, 200, 215, 0.4),
        0 6px 18px rgba(200, 80, 110, 0.45),
        0 0 30px rgba(235, 100, 140, 0.4),
        inset 0 -4px 10px rgba(160, 40, 70, 0.3),
        inset 0 6px 14px rgba(255, 220, 230, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #fff0f5;
      text-shadow: 0 0 12px #ffb0c3;
      transition: transform 0.15s ease, box-shadow 0.3s ease;
      outline: none;
      opacity: 0;
      animation: fadeSlideIn 0.8s 2.2s ease forwards;
    }

    .replay-btn:focus-visible {
      outline: 3px solid #d45d79;
      outline-offset: 5px;
    }

    .replay-btn:active {
      transform: scale(0.88);
    }

    /* ---------- PARTICLE CANVAS ---------- */
    #particleCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* ---------- EXPANDING RING ---------- */
    .reveal-ring {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 4px solid rgba(255, 180, 200, 0.85);
      box-shadow: 0 0 40px rgba(255, 140, 170, 0.7), inset 0 0 30px rgba(255, 200, 220, 0.6);
      transform: translate(-50%, -50%) scale(1);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
      will-change: transform, opacity;
    }

    .reveal-ring.active {
      animation: ringExpand 1.2s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    @keyframes ringExpand {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(50); opacity: 0; }
    }

    /* ---------- REDUCED MOTION ---------- */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .heart-btn { animation: none; }
      .ambient-heart { animation: none; opacity: 0.15; }
      .card-glow { animation: none; }
      .reveal-ring.active { animation: none; opacity: 0; }
      #particleCanvas { display: none; }
      .final-safa, .final-love, .final-miss, .replay-btn { opacity: 1; animation: none; }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 420px) {
      .glass-card {
        padding: 2.4rem 1.4rem 2.6rem;
        border-radius: 46px;
      }
      .replay-btn {
        width: 50px;
        height: 50px;
        font-size: 1.4rem;
      }
    }

    img, canvas, svg { max-width: 100%; }
  </style>
</head>
<body>
  <!-- background decorative blurred petals -->
  <div class="blur-petal petal1"></div>
  <div class="blur-petal petal2"></div>
  <div class="blur-petal petal3"></div>
  <div class="blur-petal petal4"></div>

  <!-- ambient floating hearts -->
  <div class="ambient-hearts" aria-hidden="true">
    <div class="ambient-heart">❤️</div>
    <div class="ambient-heart">❤️</div>
    <div class="ambient-heart">❤️</div>
    <div class="ambient-heart">❤️</div>
    <div class="ambient-heart">❤️</div>
    <div class="ambient-heart">❤️</div>
    <div class="ambient-heart">❤️</div>
  </div>

  <!-- full-screen canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- expanding light ring -->
  <div class="reveal-ring" id="revealRing" aria-hidden="true"></div>

  <!-- main app -->
  <div id="app">
    <!-- INITIAL SCREEN: only the heart button with "Tap here" -->
    <div id="initialScreen">
      <button 
        class="heart-btn" 
        id="heartBtn" 
        aria-label="Tap here to reveal a surprise"
        type="button"
      >
        <span class="heart-icon" aria-hidden="true">❤️</span>
        <span class="heart-label">Tap here</span>
      </button>
    </div>

    <!-- FINAL SCREEN -->
    <div id="finalScreen">
      <div class="glass-card">
        <div class="card-glow" aria-hidden="true"></div>
        <div class="final-safa">Safa</div>
        <div class="final-love">I love you</div>
        <div class="final-miss">I miss you</div>
        <button 
          class="replay-btn" 
          id="replayBtn" 
          aria-label="Replay the celebration"
          type="button"
        >
          ❤️
        </button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ---------- DOM refs ----------
      const initialScreen = document.getElementById('initialScreen');
      const finalScreen = document.getElementById('finalScreen');
      const heartBtn = document.getElementById('heartBtn');
      const replayBtn = document.getElementById('replayBtn');
      const revealRing = document.getElementById('revealRing');
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');

      // ---------- state ----------
      let isRevealed = false;
      let isAnimating = false;
      let particles = [];
      let animationFrameId = null;
      let canvasWidth = 0;
      let canvasHeight = 0;
      let dpr = 1;

      // ---------- reduced motion ----------
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ---------- canvas setup ----------
      function resizeCanvas() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = canvasWidth * dpr;
        canvas.height = canvasHeight * dpr;
        canvas.style.width = canvasWidth + 'px';
        canvas.style.height = canvasHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', () => {
        resizeCanvas();
        if (!prefersReducedMotion && particles.length > 0) {
          particles.forEach(p => {
            p.x = Math.min(p.x, canvasWidth);
            p.y = Math.min(p.y, canvasHeight);
          });
        }
      });

      resizeCanvas();

      // ---------- particle colours ----------
      const PARTICLE_COLORS = [
        '#ff6b8a', '#ff8fa3', '#ffb3c6', '#e05a7a', '#c94f6d',
        '#f9a8b7', '#ffc0cb', '#ffd700', '#ffe066', '#ffb347',
        '#ff4d6d', '#ff758f', '#d45d79', '#b1576e', '#ffc2d1'
      ];

      function createParticle(x, y, type) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 6.5;
        const size = type === 'sparkle' ? (2 + Math.random() * 5) : (6 + Math.random() * 14);
        const color = PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)];
        const life = 1.0;
        const decay = 0.007 + Math.random() * 0.012;

        return {
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2.5,
          size: size,
          color: color,
          life: life,
          decay: decay,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.18,
          type: type,
          gravity: type === 'confetti' ? 0.09 : 0.025,
          drag: 0.985,
          wobble: Math.random() * 10,
          wobbleSpeed: 0.03 + Math.random() * 0.06
        };
      }

      function spawnBurst(count) {
        if (prefersReducedMotion) return;
        const centerX = canvasWidth / 2;
        const centerY = canvasHeight / 2;

        for (let i = 0; i < count; i++) {
          const typeRoll = Math.random();
          let type;
          if (typeRoll < 0.40) type = 'heart';
          else if (typeRoll < 0.65) type = 'petal';
          else if (typeRoll < 0.82) type = 'sparkle';
          else type = 'confetti';

          particles.push(createParticle(
            centerX + (Math.random() - 0.5) * 70,
            centerY + (Math.random() - 0.5) * 70,
            type
          ));
        }
      }

      // ---------- drawing helpers ----------
      function drawHeart(ctx, x, y, size, color, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.scale(size / 20, size / 20);
        ctx.beginPath();
        ctx.moveTo(0, -6);
        ctx.bezierCurveTo(-10, -16, -20, -2, 0, 12);
        ctx.bezierCurveTo(20, -2, 10, -16, 0, -6);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }

      function drawPetal(ctx, x, y, size, color, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.beginPath();
        ctx.ellipse(0, 0, size * 0.5, size * 0.28, 0, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-size * 0.1, -size * 0.05, size * 0.12, size * 0.08, 0.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fill();
        ctx.restore();
      }

      function drawSparkle(ctx, x, y, size, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.beginPath();
        const s = size * 0.5;
        ctx.moveTo(0, -s * 1.8);
        ctx.lineTo(s * 0.4, -s * 0.4);
        ctx.lineTo(s * 1.8, 0);
        ctx.lineTo(s * 0.4, s * 0.4);
        ctx.lineTo(0, s * 1.8);
        ctx.lineTo(-s * 0.4, s * 0.4);
        ctx.lineTo(-s * 1.8, 0);
        ctx.lineTo(-s * 0.4, -s * 0.4);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 16;
        ctx.fill();
        ctx.restore();
      }

      function drawConfetti(ctx, x, y, size, color, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 6;
        ctx.fillRect(-size * 0.4, -size * 0.15, size * 0.8, size * 0.3);
        ctx.restore();
      }

      // ---------- animation loop ----------
      function updateAndDrawParticles() {
        if (prefersReducedMotion) {
          ctx.clearRect(0, 0, canvasWidth, canvasHeight);
          return;
        }

        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.vx *= p.drag;
          p.vy *= p.drag;
          p.rotation += p.rotationSpeed;
          p.life -= p.decay;
          p.wobble += p.wobbleSpeed;

          if (p.life <= 0 || p.y > canvasHeight + 100 || p.x < -120 || p.x > canvasWidth + 120) {
            particles.splice(i, 1);
            continue;
          }

          const wobbleX = Math.sin(p.wobble) * 0.8;
          const drawX = p.x + wobbleX;
          const drawY = p.y;

          ctx.globalAlpha = Math.min(p.life * 1.2, 1);

          switch (p.type) {
            case 'heart':   drawHeart(ctx, drawX, drawY, p.size, p.color, p.rotation); break;
            case 'petal':   drawPetal(ctx, drawX, drawY, p.size, p.color, p.rotation); break;
            case 'sparkle': drawSparkle(ctx, drawX, drawY, p.size, p.color); break;
            case 'confetti':drawConfetti(ctx, drawX, drawY, p.size, p.color, p.rotation); break;
          }
        }
        ctx.globalAlpha = 1;

        if (particles.length > 0) {
          animationFrameId = requestAnimationFrame(updateAndDrawParticles);
        } else {
          animationFrameId = null;
        }
      }

      function startParticleLoop() {
        if (prefersReducedMotion) return;
        if (animationFrameId) return;
        if (particles.length > 0) {
          animationFrameId = requestAnimationFrame(updateAndDrawParticles);
        }
      }

      // ---------- reveal sequence ----------
      function revealSurprise() {
        if (isRevealed || isAnimating) return;
        isAnimating = true;

        // hide initial screen
        initialScreen.classList.add('hidden');

        // ring animation
        if (!prefersReducedMotion) {
          revealRing.classList.add('active');
        }

        // burst
        if (!prefersReducedMotion) {
          spawnBurst(110);
          startParticleLoop();
        }

        // show final screen after short delay
        setTimeout(() => {
          finalScreen.classList.add('visible');
          isRevealed = true;
          isAnimating = false;
        }, prefersReducedMotion ? 250 : 500);

        // clean up ring
        if (!prefersReducedMotion) {
          setTimeout(() => {
            revealRing.classList.remove('active');
          }, 1400);
        }
      }

      function resetToInitial() {
        if (isAnimating) return;
        isAnimating = true;

        finalScreen.classList.remove('visible');

        particles = [];
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        setTimeout(() => {
          initialScreen.classList.remove('hidden');
          isRevealed = false;
          isAnimating = false;
        }, 350);
      }

      // ---------- event listeners ----------
      heartBtn.addEventListener('click', revealSurprise);

      replayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isAnimating) return;

        isAnimating = true;
        finalScreen.classList.remove('visible');

        particles = [];
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        setTimeout(() => {
          initialScreen.classList.remove('hidden');
          isRevealed = false;

          setTimeout(() => {
            revealSurprise();
          }, 200);
        }, 300);
      });

      // prevent double-tap zoom
      [heartBtn, replayBtn].forEach(btn => {
        btn.addEventListener('touchstart', () => {}, { passive: true });
        btn.addEventListener('contextmenu', (e) => e.preventDefault());
      });

      // initial clear
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

    })();
  </script>
</body>
</html>
