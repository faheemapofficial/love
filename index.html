<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>For Safa</title>
  <style>
    /* ---------- RESET ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', 'Times New Roman', 'Palatino', serif;
      position: relative;
      transition: background 2.5s ease;
      overflow-y: auto;
    }

    /* ---------- BACKGROUNDS ---------- */
    body.state-midnight {
      background:
        radial-gradient(ellipse at 20% 15%, rgba(130, 30, 75, 0.6) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 85%, rgba(95, 20, 60, 0.55) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, #3a0f24 0%, #240916 55%, #12040c 100%);
    }

    body.state-revealed {
      background:
        radial-gradient(ellipse at 25% 15%, rgba(255, 205, 225, 0.95) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(255, 195, 215, 0.9) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, #fff2f6 0%, #ffe3ec 45%, #fcd2de 100%);
    }

    /* ---------- VIGNETTE ---------- */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(20, 5, 15, 0.6) 100%);
      transition: opacity 2s ease;
    }

    body.state-revealed .vignette { opacity: 0; }

    /* ---------- GRAIN ---------- */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      transition: opacity 1.5s ease;
    }

    body.state-revealed .grain { opacity: 0.03; }

    /* ---------- BOKEH ORBS ---------- */
    .bokeh {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      transition: opacity 2s ease;
    }

    body.state-revealed .bokeh { opacity: 0.55; }

    .bokeh-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(45px);
      opacity: 0.5;
      animation: orbFloat 20s infinite ease-in-out;
    }

    .bokeh-orb:nth-child(1) { width: 240px; height: 240px; background: #ff8fb0; top: 8%; left: 5%; animation-duration: 24s; }
    .bokeh-orb:nth-child(2) { width: 200px; height: 200px; background: #ffb3c6; bottom: 10%; right: 6%; animation-duration: 28s; animation-delay: 3s; }
    .bokeh-orb:nth-child(3) { width: 160px; height: 160px; background: #ffd0a8; top: 55%; left: 75%; animation-duration: 26s; animation-delay: 6s; }
    .bokeh-orb:nth-child(4) { width: 220px; height: 220px; background: #e8a0b8; bottom: 20%; left: 15%; animation-duration: 30s; animation-delay: 2s; }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); opacity: 0.35; }
      50% { transform: translate(40px, -50px) scale(1.15); opacity: 0.65; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.35; }
    }

    /* ---------- AMBIENT GLOW DOTS ---------- */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      transition: opacity 1.5s ease;
    }

    .ambient-glow.fade-out { opacity: 0; }

    .glow-dot {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ffd7a8;
      box-shadow: 0 0 12px 4px rgba(255, 200, 150, 0.6), 0 0 24px 8px rgba(255, 170, 120, 0.25);
      animation: gentleTwinkle 4s infinite ease-in-out;
      opacity: 0.2;
    }

    @keyframes gentleTwinkle {
      0% { opacity: 0.08; transform: scale(0.7); }
      50% { opacity: 0.65; transform: scale(1.2); }
      100% { opacity: 0.08; transform: scale(0.7); }
    }

    /* ---------- APP ---------- */
    #app {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 680px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
    }

    /* ---------- INITIAL SCREEN ---------- */
    #initialScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      z-index: 20;
      transition: opacity 1s ease, transform 1s ease;
    }

    #initialScreen.hidden {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
      position: absolute;
      visibility: hidden;
    }

    .rose-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 1.5rem;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
      animation: roseSway 6s infinite ease-in-out;
      will-change: transform;
      transition: transform 0.25s ease;
    }

    .rose-btn:focus-visible {
      outline: 3px solid rgba(255, 210, 170, 0.8);
      outline-offset: 14px;
      border-radius: 50%;
    }

    .rose-btn:active { transform: scale(0.95); }

    @keyframes roseSway {
      0% { transform: rotate(-1.8deg) translateY(0); }
      25% { transform: rotate(0deg) translateY(-4px); }
      50% { transform: rotate(1.8deg) translateY(0); }
      75% { transform: rotate(0deg) translateY(-4px); }
      100% { transform: rotate(-1.8deg) translateY(0); }
    }

    .spotlight {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(255, 210, 170, 0.18) 0%, rgba(255, 180, 130, 0.06) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: spotlightPulse 4s infinite ease-in-out;
    }

    .spotlight.inner {
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(255, 230, 200, 0.25) 0%, transparent 70%);
      animation-delay: 1s;
    }

    @keyframes spotlightPulse {
      0% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
    }

    .rose-svg {
      width: 185px;
      height: 230px;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 0 40px rgba(220, 100, 140, 0.5)) drop-shadow(0 0 80px rgba(255, 150, 180, 0.25));
      animation: roseBreathe 4s infinite ease-in-out;
    }

    @keyframes roseBreathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .spark-orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220px;
      height: 220px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
      animation: orbitSpin 5s linear infinite;
    }

    @keyframes orbitSpin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .spark-dot {
      position: absolute;
      top: -6px;
      left: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff3d0, #ffd7a8);
      box-shadow:
        0 0 16px 6px rgba(255, 210, 150, 0.9),
        0 0 32px 12px rgba(255, 180, 130, 0.5),
        0 0 60px 20px rgba(255, 150, 100, 0.25);
      transform: translateX(-50%);
      animation: sparkGlow 1.5s infinite ease-in-out;
    }

    @keyframes sparkGlow {
      0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(0.9); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.3); }
    }

    .tap-label {
      margin-top: 2.2rem;
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: lowercase;
      color: #f0d0b0;
      text-shadow: 0 0 24px rgba(255, 200, 150, 0.6), 0 0 48px rgba(255, 170, 120, 0.3);
      opacity: 0.9;
      z-index: 5;
      animation: labelFade 3.5s infinite ease-in-out;
    }

    @keyframes labelFade {
      0%, 100% { opacity: 0.6; text-shadow: 0 0 20px rgba(255, 200, 150, 0.4); }
      50% { opacity: 1; text-shadow: 0 0 32px rgba(255, 210, 160, 0.8), 0 0 60px rgba(255, 180, 130, 0.5); }
    }

    /* ---------- FINAL SCREEN ---------- */
    #finalScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      z-index: 30;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.4s ease, visibility 0s 1.4s;
      pointer-events: none;
    }

    #finalScreen.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 1.4s ease, visibility 0s 0s;
    }

    /* Falling petals */
    .falling-petals {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .falling-petal {
      position: absolute;
      font-size: 1.3rem;
      opacity: 0.45;
      animation: fallDown linear infinite;
      will-change: transform, opacity;
      user-select: none;
      filter: drop-shadow(0 0 8px rgba(255, 160, 190, 0.6));
    }

    @keyframes fallDown {
      0% { transform: translateY(-10vh) rotate(0deg) scale(0.8); opacity: 0; }
      10% { opacity: 0.5; }
      50% { transform: translateY(50vh) rotate(180deg) scale(1.1); }
      90% { opacity: 0.45; }
      100% { transform: translateY(110vh) rotate(360deg) scale(0.8); opacity: 0; }
    }

    /* Glass card */
    .glass-card {
      position: relative;
      z-index: 10;
      max-width: 560px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 3.4rem 2.4rem 3rem;
      background: linear-gradient(160deg, rgba(255, 250, 248, 0.55) 0%, rgba(255, 235, 240, 0.38) 100%);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      border-radius: 60px;
      border: 1.5px solid rgba(255, 220, 210, 0.75);
      box-shadow:
        0 35px 75px -20px rgba(150, 50, 90, 0.32),
        0 0 0 1px rgba(255, 240, 235, 0.5) inset,
        0 15px 40px rgba(255, 200, 215, 0.4),
        0 0 100px rgba(255, 180, 200, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      scrollbar-width: thin;
      scrollbar-color: rgba(200, 120, 150, 0.4) transparent;
    }

    .glass-card::-webkit-scrollbar { width: 4px; }
    .glass-card::-webkit-scrollbar-thumb {
      background: rgba(200, 120, 150, 0.4);
      border-radius: 4px;
    }

    .card-glow {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(255, 140, 180, 0.25) 0%, rgba(255, 180, 210, 0) 65%);
      border-radius: 50%;
      filter: blur(55px);
      z-index: 0;
      pointer-events: none;
      animation: glowPulse 6s infinite ease-in-out;
    }

    @keyframes glowPulse {
      0% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.12); }
      100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
    }

    /* ---------- MINIMAL TEXT ---------- */
    .letter {
      position: relative;
      z-index: 10;
      width: 100%;
      text-align: center;
      color: #5a1e36;
      font-family: 'Georgia', 'Times New Roman', serif;
      line-height: 1.9;
      font-size: clamp(1.05rem, 4vw, 1.2rem);
      letter-spacing: 0.3px;
      text-shadow: 0 1px 8px rgba(255, 220, 230, 0.6);
    }

    .letter p {
      margin-bottom: 1.1em;
      opacity: 0;
      animation: fadeSlideIn 1.2s ease forwards;
    }

    .letter p:last-child { margin-bottom: 0; }

    .letter .salutation {
      font-style: italic;
      font-size: clamp(1.7rem, 7vw, 2.2rem);
      color: #7a2f45;
      letter-spacing: 1px;
      margin-bottom: 1em;
      text-shadow: 0 2px 22px rgba(255, 200, 215, 0.95), 0 0 44px rgba(255, 170, 190, 0.5);
    }

    .letter .emphasis {
      font-style: italic;
      color: #8a3b52;
      font-size: 1.05em;
    }

    .letter p:nth-child(1) { animation-delay: 0.2s; }
    .letter p:nth-child(2) { animation-delay: 1.0s; }
    .letter p:nth-child(3) { animation-delay: 4.6s; }
    .letter p:nth-child(4) { animation-delay: 5.4s; }

    @keyframes fadeSlideIn {
      0% { opacity: 0; transform: translateY(16px); filter: blur(3px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* ---------- IMPRESSIVE "I LOVE YOU" ---------- */
    .love-hero {
      position: relative;
      z-index: 10;
      width: 100%;
      margin: 2.2rem 0 2.4rem;
      opacity: 0;
      animation: loveHeroReveal 2s 2.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    @keyframes loveHeroReveal {
      0% { opacity: 0; transform: scale(0.7); filter: blur(14px); }
      55% { opacity: 1; filter: blur(0); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    /* Floating hearts around the hero text */
    .love-hero .orbit-heart {
      position: absolute;
      font-size: 1rem;
      color: #e05a7a;
      opacity: 0;
      text-shadow: 0 0 14px rgba(255, 150, 185, 0.95), 0 0 28px rgba(255, 120, 165, 0.6);
      animation: orbitHeartFloat 6s infinite ease-in-out;
      pointer-events: none;
    }

    .love-hero .orbit-heart:nth-child(1) { top: -10%; left: 8%; animation-delay: 0s; }
    .love-hero .orbit-heart:nth-child(2) { top: 15%; right: 6%; animation-delay: 1.5s; font-size: 0.85rem; }
    .love-hero .orbit-heart:nth-child(3) { bottom: -8%; left: 15%; animation-delay: 3s; font-size: 0.9rem; }
    .love-hero .orbit-heart:nth-child(4) { bottom: 10%; right: 12%; animation-delay: 4.5s; }

    @keyframes orbitHeartFloat {
      0% { opacity: 0; transform: translateY(0) scale(0.7) rotate(0deg); }
      20% { opacity: 1; }
      50% { opacity: 0.9; transform: translateY(-18px) scale(1.15) rotate(8deg); }
      80% { opacity: 0.7; }
      100% { opacity: 0; transform: translateY(-38px) scale(0.8) rotate(-6deg); }
    }

    /* The BIG impressive text */
    .love-hero .hero-text {
      display: block;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(3.4rem, 17vw, 5.6rem);
      letter-spacing: 3px;
      line-height: 1;
      background: linear-gradient(
        135deg,
        #ff6b9d 0%,
        #d43b6c 25%,
        #8a1f42 50%,
        #d43b6c 75%,
        #ff6b9d 100%
      );
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmerText 6s infinite ease-in-out;
      filter:
        drop-shadow(0 0 30px rgba(255, 170, 200, 0.9))
        drop-shadow(0 0 60px rgba(255, 130, 170, 0.6))
        drop-shadow(0 4px 20px rgba(140, 30, 70, 0.35));
      position: relative;
      padding: 0.15em 0.35em;
    }

    @keyframes shimmerText {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* Soft halo behind the hero text */
    .love-hero .hero-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 130%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(255, 160, 195, 0.4) 0%, rgba(255, 190, 215, 0.15) 45%, transparent 75%);
      border-radius: 50%;
      filter: blur(35px);
      z-index: -1;
      pointer-events: none;
      animation: haloPulse 4s infinite ease-in-out;
    }

    @keyframes haloPulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    }

    /* Decorative flourish lines */
    .love-hero .flourish {
      width: 60%;
      max-width: 220px;
      height: 1px;
      margin: 1.1rem auto 0;
      background: linear-gradient(90deg, transparent, rgba(200, 90, 130, 0.5), transparent);
      position: relative;
    }

    .love-hero .flourish::before,
    .love-hero .flourish::after {
      content: '❤';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.7rem;
      color: #d45d79;
      text-shadow: 0 0 12px rgba(255, 160, 190, 0.95);
    }

    .love-hero .flourish::before { left: 0; }
    .love-hero .flourish::after { right: 0; }

    /* Signature */
    .signature {
      position: relative;
      z-index: 10;
      width: 100%;
      text-align: center;
      margin-top: 1.6rem;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(1.15rem, 4.4vw, 1.4rem);
      color: #8a3b52;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 16px rgba(255, 200, 215, 0.85);
      opacity: 0;
      animation: fadeSlideIn 1.3s 6.0s ease forwards;
    }

    /* Replay button */
    .replay-btn {
      position: relative;
      z-index: 20;
      margin-top: 2.4rem;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 200, 180, 0.7);
      background: radial-gradient(circle at 35% 30%, rgba(255, 230, 220, 0.55), rgba(255, 200, 215, 0.28));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background 0.3s ease, box-shadow 0.3s ease;
      outline: none;
      opacity: 0;
      animation: fadeSlideIn 1s 6.5s ease forwards;
      box-shadow:
        0 6px 20px rgba(180, 80, 110, 0.25),
        0 0 30px rgba(255, 160, 190, 0.25);
    }

    .replay-btn:focus-visible {
      outline: 3px solid #d45d79;
      outline-offset: 5px;
    }

    .replay-btn:active { transform: scale(0.88); }

    .replay-btn:hover {
      background: radial-gradient(circle at 35% 30%, rgba(255, 230, 220, 0.75), rgba(255, 200, 215, 0.45));
      box-shadow:
        0 8px 26px rgba(180, 80, 110, 0.35),
        0 0 40px rgba(255, 160, 190, 0.4);
    }

    .replay-btn svg {
      width: 26px;
      height: 26px;
      fill: #8a3b52;
      filter: drop-shadow(0 0 8px rgba(255, 160, 200, 0.8));
    }

    /* Corner roses */
    .corner-rose {
      position: absolute;
      width: 110px;
      height: 130px;
      z-index: 2;
      opacity: 0.9;
      filter: drop-shadow(0 0 24px rgba(220, 110, 150, 0.45));
      pointer-events: none;
    }

    .corner-rose.bottom-left {
      bottom: -20px;
      left: -20px;
      animation: cornerSway 8s infinite ease-in-out;
    }

    .corner-rose.bottom-right {
      bottom: -20px;
      right: -20px;
      animation: cornerSwayRight 8s infinite ease-in-out;
    }

    @keyframes cornerSway {
      0%, 100% { transform: rotate(-18deg) translateY(0); }
      50% { transform: rotate(-14deg) translateY(-6px); }
    }

    @keyframes cornerSwayRight {
      0%, 100% { transform: rotate(18deg) scaleX(-1) translateY(0); }
      50% { transform: rotate(14deg) scaleX(-1) translateY(-6px); }
    }

    /* ---------- REDUCED MOTION ---------- */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .rose-btn, .rose-svg { animation: none; }
      .spark-orbit { animation: none; opacity: 0.3; }
      .ambient-glow { display: none; }
      .bokeh-orb { animation: none; opacity: 0.3; }
      .letter p, .signature, .replay-btn, .love-hero { opacity: 1; animation: none; }
      .love-hero .hero-text, .love-hero .hero-halo { animation: none; }
      .love-hero .orbit-heart { display: none; }
      .card-glow, .spotlight { animation: none; }
      .falling-petal { display: none; }
      .corner-rose { animation: none; }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 440px) {
      .glass-card {
        padding: 2.8rem 1.7rem 2.6rem;
        border-radius: 46px;
      }
      .rose-svg { width: 150px; height: 186px; }
      .spotlight { width: 280px; height: 280px; }
      .spotlight.inner { width: 170px; height: 170px; }
      .spark-orbit { width: 180px; height: 180px; }

      .corner-rose { width: 80px; height: 96px; }
      .letter { font-size: 1rem; line-height: 1.85; }
      .love-hero .hero-text { font-size: 3rem; letter-spacing: 2px; }
      .love-hero .orbit-heart { font-size: 0.85rem; }
    }

    img, canvas, svg { max-width: 100%; }
  </style>
</head>
<body class="state-midnight">

  <div id="app">

        <svg class="rose-svg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

          <path d="M100 200 Q80 185 70 195" stroke="url(#stemGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M100 180 Q120 165 130 175" stroke="url(#stemGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
          <ellipse cx="68" cy="193" rx="15" ry="6" fill="#3d2230" transform="rotate(-30 68 193)"/>
          <ellipse cx="132" cy="173" rx="15" ry="6" fill="#3d2230" transform="rotate(30 132 173)"/>

          <ellipse cx="100" cy="122" rx="42" ry="54" fill="url(#petalGrad1)" transform="rotate(-8 100 122)" opacity="0.95"/>
          <ellipse cx="100" cy="120" rx="38" ry="50" fill="url(#petalGrad1)" transform="rotate(6 100 120)" opacity="0.95"/>

          <ellipse cx="100" cy="114" rx="20" ry="32" fill="url(#petalGrad3)" transform="rotate(3 100 114)"/>
          <ellipse cx="100" cy="113" rx="14" ry="24" fill="#f0a0b5" transform="rotate(-2 100 113)"/>
          <ellipse cx="100" cy="112" rx="9" ry="16" fill="#ffd0dd" transform="rotate(2 100 112)"/>
          <ellipse cx="100" cy="111" rx="5" ry="10" fill="#fff0f5" transform="rotate(-1 100 111)"/>

          <ellipse cx="92" cy="100" rx="5" ry="10" fill="#fff5f8" opacity="0.5" transform="rotate(-20 92 100)"/>
          <ellipse cx="108" cy="105" rx="4" ry="8" fill="#fff5f8" opacity="0.35" transform="rotate(25 108 105)"/>

          <path d="M66 112 Q60 132 72 152" stroke="#7a1f38" stroke-width="1.5" fill="none" opacity="0.5"/>
          <path d="M134 112 Q140 132 128 152" stroke="#7a1f38" stroke-width="1.5" fill="none" opacity="0.5"/>
          <path d="M80 95 Q75 115 82 135" stroke="#a83552" stroke-width="1" fill="none" opacity="0.4"/>
          <path d="M120 95 Q125 115 118 135" stroke="#a83552" stroke-width="1" fill="none" opacity="0.4"/>
        </svg>
        
        <div class="spark-orbit" aria-hidden="true">
          <div class="spark-dot"></div>
        </div>
        
        <span class="tap-label">tap here</span>
      </button>
    </div>

    <!-- FINAL SCREEN -->
    <div id="finalScreen">
      <div class="falling-petals" id="fallingPetals" aria-hidden="true"></div>

      <svg class="corner-rose bottom-left" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="cr1" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ffb3c6"/>
            <stop offset="60%" stop-color="#e87a95"/>
            <stop offset="100%" stop-color="#b8305c"/>
          </radialGradient>
        </defs>
        <ellipse cx="50" cy="60" rx="32" ry="40" fill="url(#cr1)" opacity="0.85"/>
        <ellipse cx="50" cy="58" rx="25" ry="33" fill="#e87a95" opacity="0.8"/>
        <ellipse cx="50" cy="56" rx="18" ry="26" fill="#f0a0b5" opacity="0.85"/>
        <ellipse cx="50" cy="55" rx="12" ry="18" fill="#ffd0dd" opacity="0.9"/>
        <ellipse cx="50" cy="54" rx="6" ry="10" fill="#fff0f5" opacity="0.95"/>
        <path d="M50 100 Q48 115 50 120" stroke="#4a2a3a" stroke-width="4" fill="none"/>
      </svg>
      <svg class="corner-rose bottom-right" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="cr2" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ffb3c6"/>
            <stop offset="60%" stop-color="#e87a95"/>
            <stop offset="100%" stop-color="#b8305c"/>
          </radialGradient>
        </defs>
        <ellipse cx="50" cy="60" rx="32" ry="40" fill="url(#cr2)" opacity="0.85"/>
        <ellipse cx="50" cy="58" rx="25" ry="33" fill="#e87a95" opacity="0.8"/>
        <ellipse cx="50" cy="56" rx="18" ry="26" fill="#f0a0b5" opacity="0.85"/>
        <ellipse cx="50" cy="55" rx="12" ry="18" fill="#ffd0dd" opacity="0.9"/>
        <ellipse cx="50" cy="54" rx="6" ry="10" fill="#fff0f5" opacity="0.95"/>
        <path d="M50 100 Q48 115 50 120" stroke="#4a2a3a" stroke-width="4" fill="none"/>
      </svg>

      <div class="glass-card">
        <div class="card-glow" aria-hidden="true"></div>

        <div class="letter">
          <p class="salutation">Safa,</p>
          <p>I don’t always know how to explain how much you mean to me.</p>
        </div>

        <!-- THE IMPRESSIVE "I LOVE YOU" -->
        <div class="love-hero">
          <span class="orbit-heart" aria-hidden="true">❤</span>
          <span class="orbit-heart" aria-hidden="true">❤</span>
          <span class="orbit-heart" aria-hidden="true">❤</span>
          <span class="orbit-heart" aria-hidden="true">❤</span>
          <span class="hero-halo" aria-hidden="true"></span>
          <span class="hero-text">I love you</span>
          <span class="flourish" aria-hidden="true"></span>
        </div>

        <div class="letter">
          <p>I miss our conversations and the moments we spend together.</p>
          <p class="emphasis">I made this little surprise to remind you how much I love you.</p>
        </div>

        <div class="signature">— always</div>

        <button 
          class="replay-btn" 
          id="replayBtn" 
          aria-label="Replay the letter"
          type="button"
        >
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>

  <script>
    (function() {
      'use strict';

      const body = document.body;
      const initialScreen = document.getElementById('initialScreen');
      const finalScreen = document.getElementById('finalScreen');
      const roseBtn = document.getElementById('roseBtn');
      const replayBtn = document.getElementById('replayBtn');
      const ambientGlow = document.getElementById('ambientGlow');
      const fallingPetals = document.getElementById('fallingPetals');

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let isRevealed = false;
      let isAnimating = false;

      function buildFallingPetals() {
        fallingPetals.innerHTML = '';
        const count = 14;
        const symbols = ['🌸', '🌸', '🌹', '❤️', '🌸', '💗'];
        for (let i = 0; i < count; i++) {
          const petal = document.createElement('div');
          petal.className = 'falling-petal';
          petal.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          petal.style.left = (Math.random() * 100) + '%';
          petal.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
          petal.style.animationDuration = (12 + Math.random() * 16) + 's';
          petal.style.animationDelay = (Math.random() * 16) + 's';
          petal.style.opacity = 0.2 + Math.random() * 0.35;
          fallingPetals.appendChild(petal);
        }
      }

      function startReveal() {
        if (isRevealed || isAnimating) return;
        isAnimating = true;

        const sparkOrbit = document.querySelector('.spark-orbit');
        if (sparkOrbit) {
          sparkOrbit.style.animation = 'orbitSpin 0.7s linear infinite';
        }
        ambientGlow.classList.add('fade-out');

        roseBtn.style.transition = 'transform 1.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.2s ease';
        roseBtn.style.transform = 'scale(1.4)';

        setTimeout(() => {
          roseBtn.style.opacity = '0.4';
          roseBtn.style.transform = 'scale(1.75)';
        }, 700);

        setTimeout(() => {
          initialScreen.classList.add('hidden');
        }, 1400);

        setTimeout(() => {
          body.classList.remove('state-midnight');
          body.classList.add('state-revealed');
        }, 1600);

        setTimeout(() => {
          finalScreen.classList.add('visible');
          isRevealed = true;
          isAnimating = false;
          buildFallingPetals();
        }, 2000);
      }

      function resetToInitial() {
        if (isAnimating) return;
        isAnimating = true;

        finalScreen.classList.remove('visible');
        body.classList.remove('state-revealed');
        body.classList.add('state-midnight');
        ambientGlow.classList.remove('fade-out');

        roseBtn.style.transition = 'transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease';
        roseBtn.style.transform = 'scale(1)';
        roseBtn.style.opacity = '1';

        const sparkOrbit = document.querySelector('.spark-orbit');
        if (sparkOrbit) {
          sparkOrbit.style.animation = 'orbitSpin 5s linear infinite';
        }

        document.querySelectorAll('.letter p').forEach(p => {
          p.style.animation = 'none';
          void p.offsetHeight;
        });
        const sig = document.querySelector('.signature');
        if (sig) { sig.style.animation = 'none'; void sig.offsetHeight; }
        const rep = document.querySelector('.replay-btn');
        if (rep) { rep.style.animation = 'none'; void rep.offsetHeight; }
        const love = document.querySelector('.love-hero');
        if (love) { love.style.animation = 'none'; void love.offsetHeight; }

        setTimeout(() => {
          initialScreen.classList.remove('hidden');

          document.querySelectorAll('.letter p').forEach((p, i) => {
            p.style.animation = `fadeSlideIn 1.2s ${0.2 + i * 0.8}s ease forwards`;
          });
          if (love) love.style.animation = 'loveHeroReveal 2s 2.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards';
          if (sig) sig.style.animation = 'fadeSlideIn 1.3s 6.0s ease forwards';
          if (rep) rep.style.animation = 'fadeSlideIn 1s 6.5s ease forwards';

          isRevealed = false;
          isAnimating = false;
        }, 500);
      }

      roseBtn.addEventListener('click', startReveal);
      replayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        resetToInitial();
      });

      [roseBtn, replayBtn].forEach(btn => {
        btn.addEventListener('touchstart', () => {}, { passive: true });
        btn.addEventListener('contextmenu', (e) => e.preventDefault());
      });

      if (prefersReducedMotion) {
        roseBtn.addEventListener('click', function simpleReveal() {
          if (isRevealed || isAnimating) return;
          isAnimating = true;
          initialScreen.classList.add('hidden');
          body.classList.remove('state-midnight');
          body.classList.add('state-revealed');
          setTimeout(() => {
            finalScreen.classList.add('visible');
            isRevealed = true;
            isAnimating = false;
          }, 300);
        }, { once: true });
      }

    })();
  </script>
</body>
</html>
